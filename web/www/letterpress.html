<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活字印刷效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #d4c5b0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', serif;
            overflow: hidden;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 900px;
            position: relative;
        }
        .quote-text {
            font-size: 2.5rem;
            line-height: 1.8;
            color: #2c1810;
            min-height: 200px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .char {
            display: inline-block;
            font-size: 2.5rem;
            color: #2c1810;
            text-shadow: 
                1px 1px 0 rgba(0,0,0,0.3),
                2px 2px 0 rgba(0,0,0,0.2),
                3px 3px 0 rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateY(-100px) rotate(-10deg);
            animation: dropIn 0.5s ease forwards;
        }
        @keyframes dropIn {
            0% {
                opacity: 0;
                transform: translateY(-100px) rotate(-10deg);
            }
            60% {
                opacity: 1;
                transform: translateY(10px) rotate(2deg);
            }
            80% {
                transform: translateY(-5px) rotate(-1deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotate(0);
            }
        }
        .quote-info {
            margin-top: 40px;
            font-size: 1.2rem;
            color: #5c4033;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .quote-info.show {
            opacity: 1;
        }
        .ink-splash {
            position: fixed;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(44,24,16,0.1) 0%, transparent 70%);
            pointer-events: none;
            animation: splash 0.5s ease-out forwards;
        }
        @keyframes splash {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: #5c4033;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .back-link:hover { color: #2c1810; }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }
        .btn {
            background: rgba(44,24,16,0.1);
            border: 1px solid rgba(44,24,16,0.3);
            color: #2c1810;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn:hover {
            background: rgba(44,24,16,0.2);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← 返回目录</a>
    
    <div class="container">
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-info" id="quoteInfo">
            <span id="author"></span> · <span id="book"></span>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "知识就是力量", author: "培根", book: "新工具" },
            { text: "我思故我在", author: "笛卡尔", book: "第一哲学沉思集" },
            { text: "存在即合理", author: "黑格尔", book: "法哲学原理" },
            { text: "人是一根有思想的芦苇", author: "帕斯卡", book: "思想录" },
            { text: "认识你自己", author: "苏格拉底", book: "申辩篇" },
            { text: "万物皆有裂痕，那是光照进来的地方", author: "莱昂纳德·科恩", book: "颂歌" }
        ];

        let currentIndex = 0;

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            
            textEl.innerHTML = '';
            infoEl.classList.remove('show');
            
            const chars = quote.text.split('');
            chars.forEach((char, i) => {
                const span = document.createElement('span');
                span.className = 'char';
                span.textContent = char === ' ' ? '\u00A0' : char;
                span.style.animationDelay = (i * 0.1) + 's';
                textEl.appendChild(span);
                
                // 创建墨点效果
                setTimeout(() => {
                    const splash = document.createElement('div');
                    splash.className = 'ink-splash';
                    splash.style.left = (Math.random() * window.innerWidth) + 'px';
                    splash.style.top = (Math.random() * window.innerHeight) + 'px';
                    document.body.appendChild(splash);
                    setTimeout(() => splash.remove(), 500);
                }, i * 100);
            });
            
            setTimeout(() => {
                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;
                infoEl.classList.add('show');
            }, chars.length * 100 + 500);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        showQuote();
    </script>
</body>
</html>
