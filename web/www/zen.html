<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禅意庭院 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e8e0d4;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
            position: relative;
        }
        .sand-bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% 100%, #d4c8b8 0%, #e8e0d4 100%),
                url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            z-index: 0;
        }
        .ripples {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.4;
        }
        .ripple {
            position: absolute;
            border: 2px solid rgba(180, 170, 150, 0.3);
            border-radius: 50%;
            animation: rippleExpand 8s ease-out infinite;
        }
        @keyframes rippleExpand {
            0% { width: 0; height: 0; opacity: 0.6; }
            100% { width: 400px; height: 400px; opacity: 0; }
        }
        .stone {
            position: absolute;
            background: linear-gradient(135deg, #8a8a8a 0%, #6a6a6a 50%, #5a5a5a 100%);
            border-radius: 40% 60% 50% 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 2;
        }
        .stone::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 30%;
            height: 20%;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .bamboo {
            position: absolute;
            bottom: 0;
            width: 8px;
            background: linear-gradient(90deg, #4a7c4a 0%, #5a8c5a 50%, #4a7c4a 100%);
            z-index: 3;
        }
        .bamboo::before {
            content: '';
            position: absolute;
            top: 0;
            left: -2px;
            right: -2px;
            height: 3px;
            background: #3a6c3a;
            border-radius: 2px;
        }
        .bamboo-leaf {
            position: absolute;
            width: 30px;
            height: 8px;
            background: linear-gradient(90deg, #5a9c5a, #4a8c4a);
            border-radius: 0 50% 0 50%;
            transform-origin: left center;
            animation: leafSway 4s ease-in-out infinite;
        }
        @keyframes leafSway {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        .quote-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 40px;
        }
        .quote-text {
            font-size: clamp(1.6rem, 3.5vw, 2.8rem);
            line-height: 2;
            text-align: center;
            max-width: 80vw;
            color: #3a3530;
            letter-spacing: 0.15em;
            font-weight: 400;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s cubic-bezier(0.22, 1, 0.36, 1);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }
        .quote-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        .quote-info {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #777;
            letter-spacing: 0.2em;
            opacity: 0;
            transition: opacity 1s 0.5s;
        }
        .quote-info.show { opacity: 1; }
        .book-name {
            font-style: italic;
            color: #999;
        }
        .seal {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border: 2px solid #c41e3a;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c41e3a;
            font-size: 0.6rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            opacity: 0;
            transform: rotate(-5deg);
            transition: opacity 1s 1s;
        }
        .seal.show { opacity: 0.7; }
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.15);
            color: rgba(0,0,0,0.5);
            padding: 12px 32px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            letter-spacing: 0.1em;
            font-family: inherit;
        }
        .btn:hover {
            background: rgba(0,0,0,0.1);
            color: rgba(0,0,0,0.8);
        }
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(0,0,0,0.3);
            text-decoration: none;
            font-size: 0.85rem;
            z-index: 100;
            transition: color 0.3s;
            letter-spacing: 0.1em;
        }
        .back-link:hover { color: rgba(0,0,0,0.6); }
        .settings-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.15);
            color: rgba(0,0,0,0.4);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 100;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .settings-btn:hover {
            background: rgba(0,0,0,0.1);
            color: rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>
    <div class="sand-bg"></div>
    <div class="ripples" id="ripples"></div>

    <a href="quotes-showcase/index.html" class="back-link">← 返回</a>
    <button class="settings-btn" onclick="toggleSettings()">⚙</button>

    <div class="quote-container">
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-info" id="quoteInfo"></div>
        <div class="seal" id="seal">禅</div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "本来无一物，何处惹尘埃", author: "慧能", book: "六祖坛经" },
            { text: "一花一世界，一叶一菩提", author: "佛经", book: "华严经" },
            { text: "菩提本无树，明镜亦非台", author: "慧能", book: "六祖坛经" },
            { text: "行到水穷处，坐看云起时", author: "王维", book: "终南别业" },
            { text: "采菊东篱下，悠然见南山", author: "陶渊明", book: "饮酒" },
            { text: "万物静观皆自得，四时佳兴与人同", author: "程颢", book: "秋日" }
        ];

        let currentIndex = 0;

        function createZenGarden() {
            const ripples = document.getElementById('ripples');

            for (let i = 0; i < 3; i++) {
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                ripple.style.left = (20 + i * 30) + '%';
                ripple.style.top = (30 + i * 20) + '%';
                ripple.style.animationDelay = (i * 2) + 's';
                ripples.appendChild(ripple);
            }

            const stonePositions = [
                { left: '15%', top: '60%', width: '80px', height: '60px' },
                { left: '70%', top: '50%', width: '60px', height: '50px' },
                { left: '45%', top: '70%', width: '100px', height: '70px' }
            ];

            stonePositions.forEach(pos => {
                const stone = document.createElement('div');
                stone.className = 'stone';
                stone.style.left = pos.left;
                stone.style.top = pos.top;
                stone.style.width = pos.width;
                stone.style.height = pos.height;
                document.body.appendChild(stone);
            });

            for (let i = 0; i < 5; i++) {
                const bamboo = document.createElement('div');
                bamboo.className = 'bamboo';
                bamboo.style.left = (5 + i * 3) + '%';
                bamboo.style.height = (150 + Math.random() * 100) + 'px';

                for (let j = 0; j < 3; j++) {
                    const leaf = document.createElement('div');
                    leaf.className = 'bamboo-leaf';
                    leaf.style.top = (20 + j * 30) + 'px';
                    leaf.style.left = '8px';
                    leaf.style.animationDelay = (Math.random() * 2) + 's';
                    bamboo.appendChild(leaf);
                }

                document.body.appendChild(bamboo);
            }
        }

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            const sealEl = document.getElementById('seal');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');
            sealEl.classList.remove('show');

            setTimeout(() => {
                textEl.textContent = quote.text;
                infoEl.innerHTML = `${quote.author} · <span class="book-name">${quote.book}</span>`;
                textEl.classList.add('show');
                infoEl.classList.add('show');
                sealEl.classList.add('show');
            }, 300);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        function toggleSettings() {
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        createZenGarden();
        showQuote();
    </script>
</body>
</html>
