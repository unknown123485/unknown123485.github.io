<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活字印刷效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #c9b99a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', 'Georgia', serif;
            overflow: hidden;
            position: relative;
        }
        /* 纸张纹理 */
        .paper {
            position: fixed;
            inset: 0;
            background:
                url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"),
                linear-gradient(160deg, #d4c5a8 0%, #c9b99a 50%, #d0c0a0 100%);
            z-index: 0;
        }
        /* 边框 */
        .frame {
            position: fixed;
            inset: 25px;
            border: 2px solid rgba(92, 74, 48, 0.15);
            border-radius: 3px;
            z-index: 1;
            pointer-events: none;
        }
        .frame::before {
            content: '';
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(92, 74, 48, 0.08);
            border-radius: 1px;
        }
        .container {
            text-align: center;
            padding: 60px;
            max-width: 800px;
            position: relative;
            z-index: 2;
        }
        .type-case {
            background: rgba(180, 165, 140, 0.25);
            padding: 50px;
            border-radius: 2px;
            position: relative;
            box-shadow:
                inset 0 2px 4px rgba(0,0,0,0.06),
                inset 0 -1px 2px rgba(255,255,255,0.15);
        }
        .quote-text {
            font-size: 2.2rem;
            line-height: 2.2;
            color: #1a0f05;
            min-height: 200px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.12em;
            font-weight: 400;
        }
        .type-char {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.8rem;
            height: 2.8rem;
            font-size: 1.7rem;
            color: #1a0f05;
            background: linear-gradient(180deg, #e8ddd0 0%, #d8cdb8 100%);
            border: 1px solid #b8a888;
            border-radius: 2px;
            position: relative;
            box-shadow:
                0 2px 5px rgba(0,0,0,0.15),
                inset 0 1px 1px rgba(255,255,255,0.4),
                inset 0 -1px 1px rgba(0,0,0,0.08);
            opacity: 0;
            transform: translateY(-50px) rotate(-6deg);
            animation: typeDrop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .type-char::before {
            content: '';
            position: absolute;
            inset: 2px;
            border: 1px solid rgba(180, 160, 130, 0.3);
            border-radius: 1px;
            pointer-events: none;
        }
        .type-char.inked {
            color: #0a0500;
            text-shadow: 0 0 1px rgba(0,0,0,0.15);
        }
        @keyframes typeDrop {
            0% { opacity: 0; transform: translateY(-50px) rotate(-6deg); }
            60% { opacity: 1; transform: translateY(3px) rotate(1deg); }
            80% { transform: translateY(-1px) rotate(-0.5deg); }
            100% { opacity: 1; transform: translateY(0) rotate(0); }
        }
        .type-char.pressed {
            animation: typeDrop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, typePress 0.4s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
        }
        @keyframes typePress {
            0% { transform: scale(1); box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
            50% { transform: scale(0.96) translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
            100% { transform: scale(1); box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        }
        .ink-splat {
            position: fixed;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(40,25,10,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 3;
            animation: splatFade 1.5s ease-out forwards;
        }
        @keyframes splatFade {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
        .quote-info {
            margin-top: 40px;
            font-size: 0.95rem;
            color: #5c4a30;
            letter-spacing: 0.2em;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }
        .quote-info.show {
            opacity: 1;
        }
        .type-mark {
            position: absolute;
            font-size: 0.55rem;
            color: rgba(92,74,48,0.25);
            font-family: monospace;
        }
        .type-mark.top-left { top: 14px; left: 18px; }
        .type-mark.top-right { top: 14px; right: 18px; }
        .type-mark.bottom-left { bottom: 14px; left: 18px; }
        .type-mark.bottom-right { bottom: 14px; right: 18px; }
        .back-link {
            position: fixed;
            top: 35px;
            left: 35px;
            color: #5c4a30;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.4s;
            z-index: 100;
            opacity: 0.6;
        }
        .back-link:hover { color: #1a0f05; opacity: 1; }
        .controls {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: rgba(92,74,48,0.08);
            border: 1px solid rgba(92,74,48,0.2);
            color: #5c4a30;
            padding: 10px 24px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            letter-spacing: 0.1em;
        }
        .btn:hover {
            background: rgba(92,74,48,0.15);
            border-color: rgba(92,74,48,0.35);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="paper"></div>
    <div class="frame"></div>
    <a href="index.html" class="back-link">&larr; 返回目录</a>

    <div class="container">
        <div class="type-case">
            <span class="type-mark top-left">12pt</span>
            <span class="type-mark top-right">&sect;1</span>
            <div class="quote-text" id="quoteText"></div>
            <span class="type-mark bottom-left">铅字排版</span>
            <span class="type-mark bottom-right" id="pageNum">001</span>
        </div>
        <div class="quote-info" id="quoteInfo">
            <span id="author"></span> &middot; <span id="book"></span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "知识就是力量", author: "培根", book: "新工具" },
            { text: "我思故我在", author: "笛卡尔", book: "第一哲学沉思集" },
            { text: "存在即合理", author: "黑格尔", book: "法哲学原理" },
            { text: "人是一根有思想的芦苇", author: "帕斯卡", book: "思想录" },
            { text: "认识你自己", author: "苏格拉底", book: "申辩篇" },
            { text: "万物皆有裂痕，那是光照进来的地方", author: "莱昂纳德·科恩", book: "颂歌" }
        ];

        let currentIndex = 0;
        let autoPlayInterval = null;

        function createInkSplat(x, y) {
            const splat = document.createElement('div');
            splat.className = 'ink-splat';
            splat.style.left = (x - 25) + 'px';
            splat.style.top = (y - 25) + 'px';
            document.body.appendChild(splat);
            setTimeout(() => splat.remove(), 1500);
        }

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');

            textEl.innerHTML = '';
            infoEl.classList.remove('show');

            const chars = quote.text.split('');
            chars.forEach((char, i) => {
                const span = document.createElement('span');
                span.className = 'type-char';
                if (Math.random() > 0.3) span.classList.add('inked');
                span.textContent = char === ' ' ? '\u00A0' : char;
                span.style.animationDelay = (i * 0.12) + 's';
                textEl.appendChild(span);

                setTimeout(() => {
                    span.classList.add('pressed');
                    if (Math.random() > 0.88) {
                        const rect = span.getBoundingClientRect();
                        createInkSplat(rect.left + rect.width/2, rect.top + rect.height/2);
                    }
                }, i * 120 + 600);
            });

            document.getElementById('pageNum').textContent = String(currentIndex + 1).padStart(3, '0');

            setTimeout(() => {
                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;
                infoEl.classList.add('show');
            }, chars.length * 120 + 1000);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            autoPlayInterval = setInterval(nextQuote, 9000);
        }

        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') { nextQuote(); stopAutoPlay(); }
            if (e.key === 'ArrowLeft') { prevQuote(); stopAutoPlay(); }
        });

        document.addEventListener('mouseenter', stopAutoPlay, true);
        document.addEventListener('mouseleave', startAutoPlay, true);

        showQuote();
        startAutoPlay();
    </script>
</body>
</html>
