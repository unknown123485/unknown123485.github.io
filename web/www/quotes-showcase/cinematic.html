<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影字幕滚动 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #ffd700;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
            position: relative;
        }
        /* 星空背景 */
        .starfield {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 100%);
            z-index: 0;
        }
        .stars {
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 230px 80px, #fff, transparent),
                radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 370px 60px, #fff, transparent),
                radial-gradient(2px 2px at 450px 100px, rgba(255,255,255,0.8), transparent);
            background-size: 500px 200px;
            animation: twinkle 4s ease-in-out infinite alternate;
            z-index: 1;
        }
        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        /* 3D透视容器 */
        .crawl-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            perspective: 600px;
            overflow: hidden;
            z-index: 2;
        }
        .crawl-content {
            width: 70%;
            max-width: 700px;
            transform-origin: 50% 100%;
            transform: rotateX(55deg) translateY(100vh);
            animation: crawl 40s linear infinite;
        }
        @keyframes crawl {
            0% { transform: rotateX(55deg) translateY(100vh); opacity: 1; }
            95% { opacity: 1; }
            100% { transform: rotateX(55deg) translateY(-150vh); opacity: 0; }
        }
        .quote-item {
            text-align: center;
            margin-bottom: 120px;
            opacity: 0.95;
        }
        .quote-text {
            font-size: 2rem;
            line-height: 1.8;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .quote-info {
            margin-top: 30px;
            font-size: 1.1rem;
            color: #ffed4a;
        }
        .book-name {
            font-style: italic;
            opacity: 0.8;
        }
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.9rem;
            z-index: 100;
            transition: color 0.3s;
        }
        .back-link:hover { color: #fff; }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .controls:hover { opacity: 1; }
        .btn {
            background: rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            color: #ffd700;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .btn:hover {
            background: rgba(255,215,0,0.2);
            transform: scale(1.05);
        }
        /* 底部渐隐遮罩 */
        .fade-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30vh;
            background: linear-gradient(to top, #000 0%, transparent 100%);
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="starfield"></div>
    <div class="stars"></div>
    <div class="fade-bottom"></div>
    <a href="index.html" class="back-link">&larr; 返回目录</a>

    <div class="crawl-container">
        <div class="crawl-content" id="crawlContent"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="speedUp()">加速</button>
        <button class="btn" onclick="slowDown()">减速</button>
        <button class="btn" onclick="togglePause()">暂停/继续</button>
    </div>

    <script>
        const quotes = [
            { text: "在广袤的空间和无限的时间中，能与你共享同一颗行星和同一段时光，是我莫大的荣幸。", author: "卡尔·萨根", book: "宇宙" },
            { text: "给岁月以文明，而不是给文明以岁月。", author: "刘慈欣", book: "三体" },
            { text: "宇宙就是一座黑暗森林，每个文明都是带枪的猎人。", author: "刘慈欣", book: "三体II：黑暗森林" },
            { text: "人类的赞歌就是勇气的赞歌，人类的伟大就是勇气的伟大。", author: "荒木飞吕彦", book: "JOJO的奇妙冒险" },
            { text: "世界上只有一种英雄主义，就是在认清生活真相之后依然热爱生活。", author: "罗曼·罗兰", book: "米开朗基罗传" },
            { text: "我们都是由星尘构成的，当我们死去，我们将回归星空。", author: "尼尔·德格拉斯·泰森", book: "天体物理学" },
            { text: "不要温和地走进那个良夜，老年应当在日暮时燃烧咆哮。", author: "狄兰·托马斯", book: "诗集" },
            { text: "时间是一把筛子，最终会淘去一切沉渣。", author: "雨果", book: "悲惨世界" }
        ];

        let animationDuration = 40;
        let isPaused = false;

        function renderQuotes() {
            const container = document.getElementById('crawlContent');
            let html = '';
            // 重复多次以确保持续滚动
            for (let i = 0; i < 5; i++) {
                quotes.forEach(quote => {
                    html += `
                        <div class="quote-item">
                            <div class="quote-text">${quote.text}</div>
                            <div class="quote-info">
                                ${quote.author} &middot; <span class="book-name">${quote.book}</span>
                            </div>
                        </div>
                    `;
                });
            }
            container.innerHTML = html;
        }

        function speedUp() {
            animationDuration = Math.max(10, animationDuration - 5);
            updateSpeed();
        }

        function slowDown() {
            animationDuration = Math.min(80, animationDuration + 5);
            updateSpeed();
        }

        function updateSpeed() {
            const content = document.querySelector('.crawl-content');
            if (content) {
                content.style.animationDuration = animationDuration + 's';
                // 重置动画以应用新速度
                content.style.animation = 'none';
                content.offsetHeight; // 触发重排
                content.style.animation = `crawl ${animationDuration}s linear infinite`;
            }
        }

        function togglePause() {
            const content = document.querySelector('.crawl-content');
            if (!content) return;
            if (isPaused) {
                content.style.animationPlayState = 'running';
            } else {
                content.style.animationPlayState = 'paused';
            }
            isPaused = !isPaused;
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') speedUp();
            if (e.key === 'ArrowDown') slowDown();
            if (e.key === ' ') {
                e.preventDefault();
                togglePause();
            }
        });

        renderQuotes();
    </script>
</body>
</html>
