<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影字幕滚动 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            color: #c9b896;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Noto Serif SC', 'Georgia', serif;
            position: relative;
        }
        /* 极简星空 - 只有少量星星 */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        .star {
            position: absolute;
            background: #c9b896;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.15; }
            100% { opacity: 0.5; }
        }
        /* 3D透视容器 */
        .crawl-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            perspective: 600px;
            overflow: hidden;
            z-index: 2;
        }
        .crawl-content {
            width: 70%;
            max-width: 700px;
            transform-origin: 50% 100%;
            transform: rotateX(60deg) translateY(100vh);
            animation: crawl 50s linear infinite;
        }
        @keyframes crawl {
            0% { transform: rotateX(60deg) translateY(80vh); opacity: 1; }
            95% { opacity: 1; }
            100% { transform: rotateX(60deg) translateY(-200vh); opacity: 0; }
        }
        .quote-item {
            text-align: center;
            margin-bottom: 100px;
            opacity: 0.85;
        }
        .quote-text {
            font-size: 1.8rem;
            line-height: 1.9;
            font-weight: 300;
            letter-spacing: 0.06em;
        }
        .quote-info {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #a89870;
            letter-spacing: 0.2em;
        }
        .book-name {
            font-style: italic;
            opacity: 0.6;
        }
        /* 底部渐隐 */
        .fade-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50vh;
            background: linear-gradient(to top, #050505 0%, transparent 100%);
            z-index: 3;
            pointer-events: none;
        }
        .fade-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 20vh;
            background: linear-gradient(to bottom, #050505 0%, transparent 100%);
            z-index: 3;
            pointer-events: none;
        }
        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: rgba(201, 184, 150, 0.25);
            text-decoration: none;
            font-size: 0.8rem;
            z-index: 100;
            transition: color 0.5s;
            letter-spacing: 0.15em;
            font-weight: 300;
        }
        .back-link:hover { color: rgba(201, 184, 150, 0.6); }
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 100;
            opacity: 0.3;
            transition: opacity 0.5s;
        }
        .controls:hover { opacity: 1; }
        .btn {
            background: transparent;
            border: 1px solid rgba(201, 184, 150, 0.1);
            color: rgba(201, 184, 150, 0.3);
            padding: 10px 24px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.5s ease;
            letter-spacing: 0.1em;
            font-family: inherit;
            font-weight: 300;
        }
        .btn:hover {
            border-color: rgba(201, 184, 150, 0.25);
            color: rgba(201, 184, 150, 0.6);
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="fade-top"></div>
    <div class="fade-bottom"></div>
    <a href="index.html" class="back-link">&larr; 返回</a>

    <div class="crawl-container">
        <div class="crawl-content" id="crawlContent"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="speedUp()">加速</button>
        <button class="btn" onclick="slowDown()">减速</button>
        <button class="btn" onclick="togglePause()">暂停/继续</button>
    </div>

    <script>
        const quotes = [
            { text: "在广袤的空间和无限的时间中，能与你共享同一颗行星和同一段时光，是我莫大的荣幸。", author: "卡尔·萨根", book: "宇宙" },
            { text: "给岁月以文明，而不是给文明以岁月。", author: "刘慈欣", book: "三体" },
            { text: "宇宙就是一座黑暗森林，每个文明都是带枪的猎人。", author: "刘慈欣", book: "三体II：黑暗森林" },
            { text: "人类的赞歌就是勇气的赞歌，人类的伟大就是勇气的伟大。", author: "荒木飞吕彦", book: "JOJO的奇妙冒险" },
            { text: "世界上只有一种英雄主义，就是在认清生活真相之后依然热爱生活。", author: "罗曼·罗兰", book: "米开朗基罗传" },
            { text: "我们都是由星尘构成的，当我们死去，我们将回归星空。", author: "尼尔·德格拉斯·泰森", book: "天体物理学" },
            { text: "不要温和地走进那个良夜，老年应当在日暮时燃烧咆哮。", author: "狄兰·托马斯", book: "诗集" },
            { text: "时间是一把筛子，最终会淘去一切沉渣。", author: "雨果", book: "悲惨世界" }
        ];

        let animationDuration = 50;
        let isPaused = false;

        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 1.5 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 4 + 's';
                star.style.animationDuration = (2 + Math.random() * 3) + 's';
                container.appendChild(star);
            }
        }

        function renderQuotes() {
            const container = document.getElementById('crawlContent');
            let html = '';
            for (let i = 0; i < 5; i++) {
                quotes.forEach(quote => {
                    html += `
                        <div class="quote-item">
                            <div class="quote-text">${quote.text}</div>
                            <div class="quote-info">
                                ${quote.author} &middot; <span class="book-name">${quote.book}</span>
                            </div>
                        </div>
                    `;
                });
            }
            container.innerHTML = html;
        }

        function speedUp() {
            animationDuration = Math.max(20, animationDuration - 5);
            updateSpeed();
        }

        function slowDown() {
            animationDuration = Math.min(100, animationDuration + 5);
            updateSpeed();
        }

        function updateSpeed() {
            const content = document.querySelector('.crawl-content');
            if (content) {
                content.style.animation = 'none';
                content.offsetHeight;
                content.style.animation = `crawl ${animationDuration}s linear infinite`;
            }
        }

        function togglePause() {
            const content = document.querySelector('.crawl-content');
            if (!content) return;
            content.style.animationPlayState = isPaused ? 'running' : 'paused';
            isPaused = !isPaused;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') speedUp();
            if (e.key === 'ArrowDown') slowDown();
            if (e.key === ' ') {
                e.preventDefault();
                togglePause();
            }
        });

        createStars();
        renderQuotes();
    </script>
</body>
</html>
