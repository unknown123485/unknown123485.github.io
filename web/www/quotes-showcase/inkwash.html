<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水墨晕染 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f0e8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', serif;
            overflow: hidden;
            position: relative;
        }
        /* 宣纸纹理 */
        .paper-texture {
            position: fixed;
            inset: 0;
            background:
                url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.04' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
            z-index: 0;
            opacity: 0.6;
        }
        /* 水墨画布 */
        #inkCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        .quote-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px;
            max-width: 85vw;
        }
        .quote-text {
            font-size: clamp(1.6rem, 3.5vw, 2.8rem);
            line-height: 2;
            color: #1a1a1a;
            letter-spacing: 0.15em;
            font-weight: 400;
            opacity: 0;
            transform: scale(0.95);
            transition: all 1.5s cubic-bezier(0.22, 1, 0.36, 1);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }
        .quote-text.show {
            opacity: 1;
            transform: scale(1);
        }
        .quote-info {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #666;
            letter-spacing: 0.2em;
            opacity: 0;
            transition: opacity 1s 0.5s;
        }
        .quote-info.show { opacity: 1; }
        .book-name {
            font-style: italic;
            color: #999;
        }
        /* 印章 */
        .seal {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border: 3px solid #c41e3a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c41e3a;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            opacity: 0;
            transform: rotate(-5deg);
            transition: opacity 1s 1s;
        }
        .seal.show { opacity: 0.8; }
        /* 控制按钮 */
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.15);
            color: rgba(0,0,0,0.5);
            padding: 12px 32px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            letter-spacing: 0.1em;
            font-family: inherit;
        }
        .btn:hover {
            background: rgba(0,0,0,0.1);
            color: rgba(0,0,0,0.8);
        }
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(0,0,0,0.3);
            text-decoration: none;
            font-size: 0.85rem;
            z-index: 100;
            transition: color 0.3s;
            letter-spacing: 0.1em;
        }
        .back-link:hover { color: rgba(0,0,0,0.6); }
        .settings-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.15);
            color: rgba(0,0,0,0.4);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 100;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .settings-btn:hover {
            background: rgba(0,0,0,0.1);
            color: rgba(0,0,0,0.7);
        }
        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100vh;
            background: rgba(245,240,232,0.98);
            backdrop-filter: blur(30px);
            z-index: 1000;
            transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 80px 30px 30px;
            overflow-y: auto;
            box-shadow: -5px 0 30px rgba(0,0,0,0.1);
        }
        .settings-panel.open { right: 0; }
        .settings-panel h3 {
            color: rgba(0,0,0,0.8);
            font-size: 1rem;
            margin-bottom: 20px;
            letter-spacing: 0.1em;
        }
        .setting-item {
            margin-bottom: 25px;
        }
        .setting-item label {
            display: block;
            color: rgba(0,0,0,0.5);
            font-size: 0.8rem;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }
        .setting-item input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            background: rgba(0,0,0,0.1);
            border-radius: 2px;
            outline: none;
        }
        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            cursor: pointer;
        }
        .close-settings {
            position: absolute;
            top: 30px;
            right: 30px;
            background: none;
            border: none;
            color: rgba(0,0,0,0.4);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.1);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>
    <div class="paper-texture"></div>
    <canvas id="inkCanvas"></canvas>

    <a href="index.html" class="back-link">← 返回</a>
    <button class="settings-btn" onclick="toggleSettings()">⚙</button>

    <div class="overlay" id="overlay" onclick="toggleSettings()"></div>
    <div class="settings-panel" id="settingsPanel">
        <button class="close-settings" onclick="toggleSettings()">×</button>
        <h3>阅读设置</h3>
        <div class="setting-item">
            <label>字号大小</label>
            <input type="range" min="12" max="32" value="20" id="fontSizeSlider" onchange="updateFontSize()">
        </div>
        <div class="setting-item">
            <label>墨迹浓度</label>
            <input type="range" min="1" max="10" value="5" id="inkSlider" onchange="updateInk()">
        </div>
    </div>

    <div class="quote-container">
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-info" id="quoteInfo"></div>
        <div class="seal" id="seal">书摘</div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "大音希声，大象无形", author: "老子", book: "道德经" },
            { text: "上善若水，水善利万物而不争", author: "老子", book: "道德经" },
            { text: "天地有大美而不言", author: "庄子", book: "知北游" },
            { text: "采菊东篱下，悠然见南山", author: "陶渊明", book: "饮酒" },
            { text: "行到水穷处，坐看云起时", author: "王维", book: "终南别业" },
            { text: "明月松间照，清泉石上流", author: "王维", book: "山居秋暝" }
        ];

        let currentIndex = 0;
        let inkIntensity = 5;

        function initInk() {
            const canvas = document.getElementById('inkCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // 绘制水墨晕染效果
            function drawInkBlots() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const numBlots = 15 + inkIntensity * 3;

                for (let i = 0; i < numBlots; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    const radius = Math.random() * 100 + 50;
                    const opacity = (Math.random() * 0.03 + 0.01) * (inkIntensity / 5);

                    const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                    gradient.addColorStop(0, `rgba(0,0,0,${opacity})`);
                    gradient.addColorStop(0.5, `rgba(0,0,0,${opacity * 0.5})`);
                    gradient.addColorStop(1, 'transparent');

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制一些不规则的墨点
                for (let i = 0; i < numBlots * 2; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    const size = Math.random() * 30 + 5;
                    const opacity = (Math.random() * 0.05 + 0.02) * (inkIntensity / 5);

                    ctx.fillStyle = `rgba(0,0,0,${opacity})`;
                    ctx.beginPath();

                    // 不规则形状
                    const points = 5 + Math.floor(Math.random() * 5);
                    for (let j = 0; j < points; j++) {
                        const angle = (j / points) * Math.PI * 2;
                        const r = size * (0.5 + Math.random() * 0.5);
                        const px = x + Math.cos(angle) * r;
                        const py = y + Math.sin(angle) * r;
                        if (j === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
            }

            drawInkBlots();

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                drawInkBlots();
            });
        }

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            const sealEl = document.getElementById('seal');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');
            sealEl.classList.remove('show');

            setTimeout(() => {
                textEl.textContent = quote.text;
                infoEl.innerHTML = `${quote.author} · <span class="book-name">${quote.book}</span>`;
                textEl.classList.add('show');
                infoEl.classList.add('show');
                sealEl.classList.add('show');
            }, 300);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function updateFontSize() {
            const size = document.getElementById('fontSizeSlider').value;
            document.getElementById('quoteText').style.fontSize = size + 'px';
        }

        function updateInk() {
            inkIntensity = parseInt(document.getElementById('inkSlider').value);
            initInk();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        showQuote();
        initInk();
    </script>
</body>
</html>
