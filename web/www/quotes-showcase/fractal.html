<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分形生长 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050508;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
            position: relative;
        }
        #fractalCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        .quote-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 40px;
            pointer-events: none;
        }
        .quote-text {
            font-size: clamp(1.4rem, 3vw, 2.4rem);
            line-height: 1.8;
            text-align: center;
            max-width: 80vw;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 0.1em;
            font-weight: 300;
            pointer-events: auto;
        }
        .quote-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        .quote-info {
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.15em;
            opacity: 0;
            transition: opacity 1s 0.3s;
            pointer-events: auto;
        }
        .quote-info.show { opacity: 1; }
        .book-name {
            font-style: italic;
            opacity: 0.7;
        }
        /* 控制按钮 */
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6);
            padding: 12px 32px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            letter-spacing: 0.1em;
            font-family: inherit;
            backdrop-filter: blur(10px);
        }
        .btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            font-size: 0.85rem;
            z-index: 100;
            transition: color 0.3s;
            letter-spacing: 0.1em;
        }
        .back-link:hover { color: rgba(255,255,255,0.7); }
        .settings-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.5);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 100;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .settings-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100vh;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(30px);
            z-index: 1000;
            transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 80px 30px 30px;
            overflow-y: auto;
        }
        .settings-panel.open { right: 0; }
        .settings-panel h3 {
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            margin-bottom: 20px;
            letter-spacing: 0.1em;
        }
        .setting-item {
            margin-bottom: 25px;
        }
        .setting-item label {
            display: block;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }
        .setting-item input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
        }
        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            cursor: pointer;
        }
        .close-settings {
            position: absolute;
            top: 30px;
            right: 30px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>
    <canvas id="fractalCanvas"></canvas>

    <a href="index.html" class="back-link">← 返回</a>
    <button class="settings-btn" onclick="toggleSettings()">⚙</button>

    <div class="overlay" id="overlay" onclick="toggleSettings()"></div>
    <div class="settings-panel" id="settingsPanel">
        <button class="close-settings" onclick="toggleSettings()">×</button>
        <h3>阅读设置</h3>
        <div class="setting-item">
            <label>生长速度</label>
            <input type="range" min="1" max="10" value="5" id="speedSlider" onchange="updateSpeed()">
        </div>
        <div class="setting-item">
            <label>分形复杂度</label>
            <input type="range" min="5" max="12" value="8" id="depthSlider" onchange="updateDepth()">
        </div>
        <div class="setting-item">
            <label>字号大小</label>
            <input type="range" min="12" max="32" value="20" id="fontSizeSlider" onchange="updateFontSize()">
        </div>
    </div>

    <div class="quote-container">
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-info" id="quoteInfo"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "一花一世界，一叶一菩提", author: "佛经", book: "华严经" },
            { text: "万物皆有裂痕，那是光照进来的地方", author: "莱昂纳德·科恩", book: "颂歌" },
            { text: "生命是一袭华美的袍，爬满了蚤子", author: "张爱玲", book: "天才梦" },
            { text: "世界上的一切都在生长，一切都在变化", author: "泰戈尔", book: "飞鸟集" },
            { text: "从一粒沙看世界，从一朵花看天堂", author: "威廉·布莱克", book: "纯真的预言" },
            { text: "万物生长，各自高贵", author: "庄子", book: "逍遥游" }
        ];

        let currentIndex = 0;
        let growthSpeed = 5;
        let fractalDepth = 8;
        let animationId;
        let branches = [];
        let time = 0;

        function initFractal() {
            const canvas = document.getElementById('fractalCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            branches = [];
            time = 0;

            // 创建初始分支
            const numRoots = 3;
            for (let i = 0; i < numRoots; i++) {
                const angle = (Math.PI * 2 / numRoots) * i - Math.PI / 2;
                branches.push({
                    x: canvas.width / 2,
                    y: canvas.height,
                    angle: angle,
                    length: 0,
                    maxLength: 150 + Math.random() * 100,
                    width: 8,
                    depth: 0,
                    color: `hsl(${180 + Math.random() * 60}, 70%, 60%)`,
                    growing: true,
                    children: []
                });
            }

            function animate() {
                ctx.fillStyle = 'rgba(5, 5, 8, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                time += 0.01 * growthSpeed;

                // 生长和绘制分支
                branches.forEach(branch => growAndDrawBranch(ctx, branch));

                // 添加发光粒子
                if (Math.random() < 0.1 * growthSpeed) {
                    addGlowParticle(canvas.width, canvas.height);
                }

                drawGlowParticles(ctx);

                animationId = requestAnimationFrame(animate);
            }

            if (animationId) cancelAnimationFrame(animationId);
            animate();
        }

        function growAndDrawBranch(ctx, branch) {
            if (branch.growing) {
                branch.length += 0.5 * growthSpeed;
                if (branch.length >= branch.maxLength) {
                    branch.growing = false;
                    if (branch.depth < fractalDepth) {
                        createChildren(branch);
                    }
                }
            }

            // 绘制分支
            const endX = branch.x + Math.cos(branch.angle) * branch.length;
            const endY = branch.y + Math.sin(branch.angle) * branch.length;

            ctx.strokeStyle = branch.color;
            ctx.lineWidth = branch.width;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 10;
            ctx.shadowColor = branch.color;

            ctx.beginPath();
            ctx.moveTo(branch.x, branch.y);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            ctx.shadowBlur = 0;

            // 绘制子分支
            branch.children.forEach(child => {
                child.x = endX;
                child.y = endY;
                growAndDrawBranch(ctx, child);
            });
        }

        function createChildren(branch) {
            const numChildren = 2 + Math.floor(Math.random() * 2);
            for (let i = 0; i < numChildren; i++) {
                const angleOffset = (Math.random() - 0.5) * Math.PI / 2;
                branch.children.push({
                    x: 0,
                    y: 0,
                    angle: branch.angle + angleOffset,
                    length: 0,
                    maxLength: branch.maxLength * (0.6 + Math.random() * 0.2),
                    width: branch.width * 0.7,
                    depth: branch.depth + 1,
                    color: `hsl(${180 + Math.random() * 60}, 70%, ${50 + branch.depth * 3}%)`,
                    growing: true,
                    children: []
                });
            }
        }

        let glowParticles = [];

        function addGlowParticle(w, h) {
            glowParticles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                size: Math.random() * 3 + 1,
                opacity: Math.random() * 0.5 + 0.2,
                life: 100,
                color: `hsl(${180 + Math.random() * 60}, 70%, 70%)`
            });
        }

        function drawGlowParticles(ctx) {
            glowParticles = glowParticles.filter(p => {
                p.life--;
                p.opacity *= 0.98;

                if (p.life <= 0) return false;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.opacity;
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;

                return true;
            });
        }

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');

            setTimeout(() => {
                textEl.textContent = quote.text;
                infoEl.innerHTML = `${quote.author} · <span class="book-name">${quote.book}</span>`;
                textEl.classList.add('show');
                infoEl.classList.add('show');
            }, 300);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
            // 重新生长
            initFractal();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
            initFractal();
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function updateSpeed() {
            growthSpeed = parseInt(document.getElementById('speedSlider').value);
        }

        function updateDepth() {
            fractalDepth = parseInt(document.getElementById('depthSlider').value);
            initFractal();
        }

        function updateFontSize() {
            const size = document.getElementById('fontSizeSlider').value;
            document.getElementById('quoteText').style.fontSize = size + 'px';
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('fractalCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        showQuote();
        initFractal();
    </script>
</body>
</html>
