<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹灯管效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            position: relative;
        }
        /* 极简深色背景，只有微妙渐变 */
        .bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 100%, rgba(139, 92, 246, 0.06) 0%, transparent 50%), #0a0a0f;
            z-index: 0;
        }
        .container {
            text-align: center;
            padding: 80px 60px;
            max-width: 900px;
            position: relative;
            z-index: 10;
        }
        /* 引号 */
        .quote-mark {
            font-size: 8rem;
            color: rgba(255, 255, 255, 0.04);
            line-height: 0.5;
            margin-bottom: 30px;
            font-family: Georgia, serif;
            font-weight: 300;
        }
        /* 文字 - 极简，只有微妙发光 */
        .quote-text {
            font-size: 2.6rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.92);
            letter-spacing: 0.08em;
            font-weight: 300;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-shadow: 0 0 40px rgba(139, 92, 246, 0.15), 0 0 80px rgba(139, 92, 246, 0.05);
        }
        .quote-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        .quote-text .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            animation: charFade 0.6s ease forwards;
        }
        @keyframes charFade {
            to { opacity: 1; transform: translateY(0); }
        }
        /* 分隔线 */
        .divider {
            width: 60px;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 50px auto 30px;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
        }
        .divider.show {
            opacity: 1;
        }
        .quote-info {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.25em;
            opacity: 0;
            transition: opacity 1.5s ease 0.8s;
            font-weight: 400;
        }
        .quote-info.show {
            opacity: 1;
        }
        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: rgba(255, 255, 255, 0.25);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.5s;
            z-index: 100;
            letter-spacing: 0.15em;
            font-weight: 300;
        }
        .back-link:hover { color: rgba(255, 255, 255, 0.6); }
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 100;
        }
        .btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.3);
            padding: 12px 32px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.5s ease;
            letter-spacing: 0.15em;
            font-family: inherit;
            font-weight: 300;
        }
        .btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <a href="index.html" class="back-link">&larr; 返回</a>

    <div class="container">
        <div class="quote-mark">"</div>
        <div class="quote-text" id="quoteText"></div>
        <div class="divider" id="divider"></div>
        <div class="quote-info" id="quoteInfo">
            <span id="author"></span> &middot; <span id="book"></span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "霓虹之下，我们都是孤独的舞者", author: "村上春树", book: "挪威的森林" },
            { text: "城市是一座巨大的迷宫，我们在其中寻找出口", author: "博尔赫斯", book: "迷宫" },
            { text: "黑夜给了我黑色的眼睛，我却用它寻找光明", author: "顾城", book: "一代人" },
            { text: "我们都是夜行动物，在城市的霓虹中觅食", author: "雷蒙德·钱德勒", book: "漫长的告别" },
            { text: "在赛博朋克的世界里，每个人都是自己的黑客", author: "威廉·吉布森", book: "神经漫游者" },
            { text: "霓虹灯下的阴影里，藏着最真实的我们", author: "菲茨杰拉德", book: "了不起的盖茨比" }
        ];

        let currentIndex = 0;
        let autoPlayInterval = null;

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            const dividerEl = document.getElementById('divider');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');
            dividerEl.classList.remove('show');

            setTimeout(() => {
                textEl.innerHTML = '';
                const chars = quote.text.split('');
                chars.forEach((char, i) => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    span.style.animationDelay = (i * 0.04) + 's';
                    textEl.appendChild(span);
                });

                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;

                textEl.classList.add('show');
                setTimeout(() => {
                    dividerEl.classList.add('show');
                    infoEl.classList.add('show');
                }, 300);
            }, 400);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            autoPlayInterval = setInterval(nextQuote, 8000);
        }

        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') { nextQuote(); stopAutoPlay(); }
            if (e.key === 'ArrowLeft') { prevQuote(); stopAutoPlay(); }
        });

        document.addEventListener('mouseenter', stopAutoPlay, true);
        document.addEventListener('mouseleave', startAutoPlay, true);

        showQuote();
        startAutoPlay();
    </script>
</body>
</html>
