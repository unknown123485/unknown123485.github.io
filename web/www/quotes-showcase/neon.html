<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹灯管效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0c0c14;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', 'Georgia', serif;
            overflow: hidden;
            position: relative;
        }
        /* 深邃背景 */
        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 70% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 50% 30% at 30% 20%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                #0c0c14;
            z-index: 0;
        }
        /*  subtle grid */
        .grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 80px 80px;
            pointer-events: none;
            z-index: 1;
        }
        /* floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 1;
            animation: orbFloat 20s ease-in-out infinite;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: rgba(139, 92, 246, 0.12);
            top: 10%; left: 60%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: rgba(59, 130, 246, 0.08);
            top: 60%; left: 10%;
            animation-delay: -7s;
        }
        .orb-3 {
            width: 250px; height: 250px;
            background: rgba(236, 72, 153, 0.06);
            top: 40%; left: 40%;
            animation-delay: -14s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        .container {
            text-align: center;
            padding: 60px;
            max-width: 800px;
            position: relative;
            z-index: 10;
        }
        /* 引号装饰 */
        .quote-mark {
            font-size: 6rem;
            color: rgba(139, 92, 246, 0.15);
            line-height: 1;
            margin-bottom: -20px;
            font-family: Georgia, serif;
        }
        .quote-text {
            font-size: 2.4rem;
            line-height: 1.9;
            color: #e2e8f0;
            letter-spacing: 0.06em;
            font-weight: 300;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .quote-text.show {
            opacity: 1;
        }
        .quote-text .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(30px);
            animation: charReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes charReveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* 霓虹光晕 - 更 subtle */
        .glow-line {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.4), transparent);
            margin: 40px auto;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }
        .glow-line.show {
            opacity: 1;
        }
        .quote-info {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #64748b;
            letter-spacing: 0.2em;
            opacity: 0;
            transition: opacity 1s ease 1s;
            font-weight: 400;
        }
        .quote-info.show {
            opacity: 1;
        }
        .quote-info .author {
            color: #94a3b8;
        }
        .quote-info .book {
            color: #475569;
            font-style: italic;
        }
        /* 底部粒子 */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            animation: particleRise 15s linear infinite;
        }
        @keyframes particleRise {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) translateX(20px); opacity: 0; }
        }
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(148, 163, 184, 0.4);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.4s;
            z-index: 100;
            letter-spacing: 0.1em;
        }
        .back-link:hover { color: #94a3b8; }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #64748b;
            padding: 10px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.08em;
            font-family: inherit;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(139, 92, 246, 0.2);
            color: #94a3b8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <a href="index.html" class="back-link">&larr; 返回目录</a>

    <div class="container">
        <div class="quote-mark">"</div>
        <div class="quote-text" id="quoteText"></div>
        <div class="glow-line" id="glowLine"></div>
        <div class="quote-info" id="quoteInfo">
            <span class="author" id="author"></span> &middot; <span class="book" id="book"></span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "霓虹之下，我们都是孤独的舞者", author: "村上春树", book: "挪威的森林" },
            { text: "城市是一座巨大的迷宫，我们在其中寻找出口", author: "博尔赫斯", book: "迷宫" },
            { text: "黑夜给了我黑色的眼睛，我却用它寻找光明", author: "顾城", book: "一代人" },
            { text: "我们都是夜行动物，在城市的霓虹中觅食", author: "雷蒙德·钱德勒", book: "漫长的告别" },
            { text: "在赛博朋克的世界里，每个人都是自己的黑客", author: "威廉·吉布森", book: "神经漫游者" },
            { text: "霓虹灯下的阴影里，藏着最真实的我们", author: "菲茨杰拉德", book: "了不起的盖茨比" }
        ];

        let currentIndex = 0;
        let autoPlayInterval = null;

        function createParticles() {
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (12 + Math.random() * 10) + 's';
                const size = 1 + Math.random() * 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                document.body.appendChild(p);
            }
        }

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            const lineEl = document.getElementById('glowLine');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');
            lineEl.classList.remove('show');

            setTimeout(() => {
                textEl.innerHTML = '';
                const chars = quote.text.split('');
                chars.forEach((char, i) => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    span.style.animationDelay = (i * 0.06) + 's';
                    textEl.appendChild(span);
                });

                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;

                textEl.classList.add('show');
                setTimeout(() => {
                    lineEl.classList.add('show');
                    infoEl.classList.add('show');
                }, 400);
            }, 400);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            autoPlayInterval = setInterval(nextQuote, 7000);
        }

        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') { nextQuote(); stopAutoPlay(); }
            if (e.key === 'ArrowLeft') { prevQuote(); stopAutoPlay(); }
        });

        document.addEventListener('mouseenter', stopAutoPlay, true);
        document.addEventListener('mouseleave', startAutoPlay, true);

        createParticles();
        showQuote();
        startAutoPlay();
    </script>
</body>
</html>
