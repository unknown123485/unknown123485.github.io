<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹灯管效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050508;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', serif;
            overflow: hidden;
            position: relative;
        }
        /* 深邃背景 + 径向光晕 */
        .bg-glow {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 50% 120%, rgba(120, 80, 220, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 20% 50%, rgba(80, 40, 160, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 30%, rgba(60, 30, 140, 0.08) 0%, transparent 50%),
                #050508;
            z-index: 0;
        }
        /* 网格地板 */
        .grid-floor {
            position: fixed;
            bottom: -30%;
            left: -50%;
            width: 200%;
            height: 80%;
            background-image: 
                linear-gradient(rgba(120, 80, 220, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 80, 220, 0.08) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }
        /* 浮动粒子 */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            animation: particleFloat linear infinite;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 900px;
            position: relative;
            z-index: 10;
        }
        /* 霓虹文字 - 专业多层阴影 */
        .quote-text {
            font-size: 2.8rem;
            line-height: 1.8;
            color: #f0e8ff;
            letter-spacing: 0.08em;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .quote-text.show {
            opacity: 1;
        }
        .quote-text .char {
            display: inline-block;
            position: relative;
            color: #faf5ff;
            text-shadow:
                /* 核心高光 */
                0 0 1px #fff,
                0 0 2px #fff,
                /* 内层辉光 */
                0 0 10px rgba(180, 140, 255, 0.8),
                0 0 20px rgba(160, 120, 240, 0.6),
                /* 中层扩散 */
                0 0 40px rgba(140, 100, 220, 0.4),
                0 0 80px rgba(120, 80, 200, 0.3),
                /* 外层光晕 */
                0 0 120px rgba(100, 60, 180, 0.2);
            animation: neonBreathe 3s ease-in-out infinite;
        }
        .quote-text .char:nth-child(3n) { animation-delay: 0.2s; }
        .quote-text .char:nth-child(3n+1) { animation-delay: 0.5s; }
        .quote-text .char:nth-child(3n+2) { animation-delay: 0.8s; }

        @keyframes neonBreathe {
            0%, 100% {
                text-shadow:
                    0 0 1px #fff,
                    0 0 2px #fff,
                    0 0 10px rgba(180, 140, 255, 0.8),
                    0 0 20px rgba(160, 120, 240, 0.6),
                    0 0 40px rgba(140, 100, 220, 0.4),
                    0 0 80px rgba(120, 80, 200, 0.3),
                    0 0 120px rgba(100, 60, 180, 0.2);
                opacity: 1;
            }
            50% {
                text-shadow:
                    0 0 2px #fff,
                    0 0 4px #fff,
                    0 0 15px rgba(180, 140, 255, 1),
                    0 0 30px rgba(160, 120, 240, 0.8),
                    0 0 60px rgba(140, 100, 220, 0.5),
                    0 0 100px rgba(120, 80, 200, 0.4),
                    0 0 150px rgba(100, 60, 180, 0.25);
                opacity: 0.95;
            }
        }
        /* 偶尔闪烁效果 */
        .quote-text .char.flicker {
            animation: neonBreathe 3s ease-in-out infinite, flicker 4s ease-in-out infinite;
        }
        @keyframes flicker {
            0%, 90%, 100% { opacity: 1; }
            91% { opacity: 0.3; }
            92% { opacity: 1; }
            93% { opacity: 0.5; }
            94% { opacity: 1; }
        }
        /* 装饰线 */
        .neon-line {
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(180, 140, 255, 0.5), transparent);
            margin: 30px auto;
            box-shadow: 0 0 10px rgba(180, 140, 255, 0.3);
            opacity: 0;
            transition: opacity 1s ease 0.3s;
        }
        .neon-line.show {
            opacity: 1;
        }
        .quote-info {
            margin-top: 20px;
            font-size: 1rem;
            color: #a090c0;
            letter-spacing: 0.15em;
            opacity: 0;
            transition: opacity 1s ease 0.6s;
        }
        .quote-info.show {
            opacity: 1;
        }
        .quote-info .author {
            color: #c0b0e0;
        }
        .quote-info .book {
            color: #8070a0;
            font-style: italic;
        }
        /* 扫描线 */
        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(0, 0, 0, 0.08) 3px,
                rgba(0, 0, 0, 0.08) 6px
            );
            pointer-events: none;
            z-index: 20;
            opacity: 0.4;
        }
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(160, 150, 180, 0.5);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
            z-index: 100;
        }
        .back-link:hover { color: #c0b0e0; }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        .btn {
            background: rgba(140, 100, 220, 0.08);
            border: 1px solid rgba(140, 100, 220, 0.2);
            color: #a090c0;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            letter-spacing: 0.05em;
        }
        .btn:hover {
            background: rgba(140, 100, 220, 0.15);
            border-color: rgba(140, 100, 220, 0.35);
            color: #d0c0f0;
            box-shadow: 0 0 20px rgba(140, 100, 220, 0.15);
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="grid-floor"></div>
    <div class="scanline"></div>
    <a href="index.html" class="back-link">&larr; 返回目录</a>

    <div class="container">
        <div class="quote-text" id="quoteText"></div>
        <div class="neon-line" id="neonLine"></div>
        <div class="quote-info" id="quoteInfo">
            <span class="author" id="author"></span> &middot; <span class="book" id="book"></span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "霓虹之下，我们都是孤独的舞者", author: "村上春树", book: "挪威的森林" },
            { text: "城市是一座巨大的迷宫，我们在其中寻找出口", author: "博尔赫斯", book: "迷宫" },
            { text: "黑夜给了我黑色的眼睛，我却用它寻找光明", author: "顾城", book: "一代人" },
            { text: "我们都是夜行动物，在城市的霓虹中觅食", author: "雷蒙德·钱德勒", book: "漫长的告别" },
            { text: "在赛博朋克的世界里，每个人都是自己的黑客", author: "威廉·吉布森", book: "神经漫游者" },
            { text: "霓虹灯下的阴影里，藏着最真实的我们", author: "菲茨杰拉德", book: "了不起的盖茨比" }
        ];

        let currentIndex = 0;
        let autoPlayInterval = null;

        function createParticles() {
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.animationDuration = (8 + Math.random() * 8) + 's';
                const size = 1 + Math.random() * 3;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                const hue = 240 + Math.random() * 40;
                p.style.background = `hsl(${hue}, 70%, 70%)`;
                p.style.boxShadow = `0 0 ${size * 2}px hsl(${hue}, 70%, 70%)`;
                document.body.appendChild(p);
            }
        }

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            const lineEl = document.getElementById('neonLine');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');
            lineEl.classList.remove('show');

            setTimeout(() => {
                textEl.innerHTML = '';
                const chars = quote.text.split('');
                chars.forEach((char, i) => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    if (Math.random() > 0.7) span.classList.add('flicker');
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    span.style.animationDelay = (i * 0.04) + 's';
                    textEl.appendChild(span);
                });

                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;

                textEl.classList.add('show');
                setTimeout(() => {
                    lineEl.classList.add('show');
                    infoEl.classList.add('show');
                }, 200);
            }, 300);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            autoPlayInterval = setInterval(nextQuote, 6000);
        }

        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') { nextQuote(); stopAutoPlay(); }
            if (e.key === 'ArrowLeft') { prevQuote(); stopAutoPlay(); }
        });

        // 鼠标悬停时暂停自动播放
        document.addEventListener('mouseenter', stopAutoPlay, true);
        document.addEventListener('mouseleave', startAutoPlay, true);

        createParticles();
        showQuote();
        startAutoPlay();
    </script>
</body>
</html>
