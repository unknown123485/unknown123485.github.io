<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战术终端 HUD - 书摘展示</title>
    <style>
        :root {
            --amber: #FF9F00;
            --amber-dim: rgba(255, 159, 0, 0.3);
            --amber-glow: rgba(255, 159, 0, 0.15);
            --bg: #0a0a0f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            min-height: 100vh;
            font-family: 'Courier New', 'Noto Sans SC', monospace;
            color: var(--amber);
            overflow-x: hidden;
        }
        /* CRT扫描线 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }
        /* 网格背景 */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 159, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 159, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }
        /* 顶部导航栏 */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10, 10, 15, 0.9);
            border-bottom: 1px solid var(--amber-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 100;
        }
        .nav-brand {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--amber);
            text-shadow: 0 0 10px var(--amber);
        }
        .nav-sub {
            font-size: 0.7rem;
            color: var(--amber-dim);
            margin-left: 10px;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 0.75rem;
        }
        .nav-time {
            font-family: 'Courier New', monospace;
        }
        /* 左侧边栏 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 60px;
            bottom: 0;
            width: 200px;
            background: rgba(10, 10, 15, 0.95);
            border-right: 1px solid var(--amber-dim);
            padding: 20px 0;
            z-index: 90;
            overflow-y: auto;
        }
        .sidebar-item {
            padding: 12px 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-item:hover {
            background: var(--amber);
            color: #000;
        }
        .sidebar-item.active {
            border-left-color: var(--amber);
            background: rgba(255, 159, 0, 0.1);
        }
        .sidebar-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 主内容区 */
        .main-content {
            margin-left: 200px;
            margin-top: 60px;
            padding: 30px;
            min-height: calc(100vh - 60px);
            position: relative;
            z-index: 10;
        }
        /* 卡片网格 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        /* 战术卡片 */
        .tactical-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--amber-dim);
            position: relative;
            overflow: hidden;
        }
        .tactical-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--amber), transparent);
            opacity: 0.5;
        }
        .card-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--amber-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }
        .card-title {
            font-weight: bold;
            letter-spacing: 0.1em;
        }
        .card-badge {
            background: var(--amber);
            color: #000;
            padding: 2px 8px;
            font-size: 0.65rem;
            font-weight: bold;
        }
        .card-body {
            padding: 20px;
        }
        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 159, 0, 0.1);
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--amber);
            position: relative;
            animation: progressPulse 2s ease-in-out infinite;
        }
        @keyframes progressPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        /* 数据文本 */
        .data-text {
            font-size: 0.75rem;
            line-height: 1.8;
            color: rgba(255, 159, 0, 0.8);
        }
        .data-highlight {
            color: #FFF3E0;
            text-shadow: 0 0 5px var(--amber);
            font-size: 1.5rem;
            font-weight: bold;
        }
        /* 圆形指示器 */
        .circle-indicator {
            width: 80px;
            height: 80px;
            border: 2px solid var(--amber-dim);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0 auto;
        }
        .circle-indicator::before {
            content: '';
            position: absolute;
            inset: -5px;
            border: 1px solid var(--amber-dim);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .circle-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #FFF3E0;
            text-shadow: 0 0 10px var(--amber);
        }
        /* 六边形网格 */
        .hex-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 20px;
        }
        .hex-item {
            width: 60px;
            height: 52px;
            background: rgba(255, 159, 0, 0.1);
            border: 1px solid var(--amber-dim);
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0s;
        }
        .hex-item:hover {
            background: var(--amber);
            color: #000;
        }
        /* 底部状态栏 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 200px;
            right: 0;
            height: 40px;
            background: rgba(10, 10, 15, 0.95);
            border-top: 1px solid var(--amber-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            font-size: 0.7rem;
            z-index: 100;
        }
        /* 按钮 */
        .hud-btn {
            background: transparent;
            border: 1px solid var(--amber-dim);
            color: var(--amber);
            padding: 8px 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0s;
            font-family: inherit;
            letter-spacing: 0.1em;
        }
        .hud-btn:hover {
            background: var(--amber);
            color: #000;
        }
        /* 引用文字 */
        .quote-display {
            text-align: center;
            padding: 40px;
        }
        .quote-text {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            line-height: 1.8;
            color: #FFF3E0;
            text-shadow:
                0 0 2px #FF9F00,
                0 0 8px #FF9F00,
                0 0 20px rgba(255, 159, 0, 0.5);
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            opacity: 0;
        }
        .quote-text.show {
            animation: flickerIn 0.5s steps(5) forwards;
        }
        @keyframes flickerIn {
            0% { opacity: 0; }
            20% { opacity: 1; }
            40% { opacity: 0.3; }
            60% { opacity: 0.8; }
            80% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .quote-info {
            font-size: 0.8rem;
            color: var(--amber);
            letter-spacing: 0.2em;
            opacity: 0;
        }
        .quote-info.show {
            animation: flickerIn 0.3s steps(3) 0.5s forwards;
        }
        /* 导航按钮 */
        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }
            .sidebar-item span {
                display: none;
            }
            .main-content {
                margin-left: 60px;
            }
            .bottom-bar {
                left: 60px;
            }
            .card-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <!-- 顶部导航 -->
    <div class="top-nav">
        <div>
            <span class="nav-brand">MAS.READER</span>
            <span class="nav-sub">// TACTICAL_DISPLAY</span>
        </div>
        <div class="nav-right">
            <div class="status-indicator">
                <span style="color: var(--amber); animation: blink 1s steps(2) infinite;">●</span>
                <span>ONLINE</span>
            </div>
            <div class="nav-time" id="clock">00:00:00</div>
        </div>
    </div>

    <!-- 左侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-item active">
            <div class="sidebar-icon">◆</div>
            <span>书摘终端</span>
        </div>
        <div class="sidebar-item">
            <div class="sidebar-icon">◎</div>
            <span>数据面板</span>
        </div>
        <div class="sidebar-item">
            <div class="sidebar-icon">▣</div>
            <span>系统状态</span>
        </div>
        <div class="sidebar-item" onclick="window.location.href='index.html'">
            <div class="sidebar-icon">←</div>
            <span>返回主页</span>
        </div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <!-- 顶部卡片行 -->
        <div class="card-grid">
            <div class="tactical-card">
                <div class="card-header">
                    <span class="card-title">本月目标</span>
                    <span class="card-badge">进行中</span>
                </div>
                <div class="card-body">
                    <div class="data-text">
                        当前阅读进度
                        <div class="data-highlight" id="readProgress">24%</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 24%"></div>
                    </div>
                    <div class="data-text">已读完 6 / 25 本书籍</div>
                </div>
            </div>

            <div class="tactical-card">
                <div class="card-header">
                    <span class="card-title">阅读统计</span>
                    <span class="card-badge">实时</span>
                </div>
                <div class="card-body">
                    <div style="display: flex; justify-content: space-around; text-align: center;">
                        <div>
                            <div class="data-highlight">24h</div>
                            <div class="data-text">本周阅读</div>
                        </div>
                        <div>
                            <div class="data-highlight">9天</div>
                            <div class="data-text">连续打卡</div>
                        </div>
                        <div>
                            <div class="data-highlight">5</div>
                            <div class="data-text">今日笔记</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tactical-card">
                <div class="card-header">
                    <span class="card-title">系统状态</span>
                    <span class="card-badge">正常</span>
                </div>
                <div class="card-body">
                    <div class="circle-indicator">
                        <div class="circle-value">98%</div>
                    </div>
                    <div class="data-text" style="text-align: center; margin-top: 10px;">
                        系统运行效率
                    </div>
                </div>
            </div>
        </div>

        <!-- 书摘显示区 -->
        <div class="tactical-card">
            <div class="card-header">
                <span class="card-title">书摘数据流</span>
                <span class="card-badge">LIVE</span>
            </div>
            <div class="card-body">
                <div class="quote-display">
                    <div class="quote-text" id="quoteText"></div>
                    <div class="quote-info" id="quoteInfo"></div>
                </div>
                <div class="nav-buttons">
                    <button class="hud-btn" onclick="prevQuote()">&lt; 上一条</button>
                    <button class="hud-btn" onclick="nextQuote()">下一条 &gt;</button>
                </div>
            </div>
        </div>

        <!-- 六边形能力图 -->
        <div class="tactical-card" style="margin-top: 20px;">
            <div class="card-header">
                <span class="card-title">能力矩阵</span>
                <span class="card-badge">分析</span>
            </div>
            <div class="hex-grid">
                <div class="hex-item">文学</div>
                <div class="hex-item">哲学</div>
                <div class="hex-item">历史</div>
                <div class="hex-item">科学</div>
                <div class="hex-item">艺术</div>
                <div class="hex-item">技术</div>
            </div>
        </div>
    </div>

    <!-- 底部状态栏 -->
    <div class="bottom-bar">
        <div>COORD: <span id="coords">34.0522°N, 118.2437°W</span></div>
        <div>SECTOR: ALPHA-7</div>
        <div>VER: 7.5.0</div>
    </div>

    <script>
        const quotes = [
            { text: "科技是人类的延伸，也是人类的镜子", author: "马歇尔·麦克卢汉", book: "理解媒介" },
            { text: "未来已来，只是分布不均", author: "威廉·吉布森", book: "神经漫游者" },
            { text: "在数字世界中，信息就是力量", author: "尼尔·斯蒂芬森", book: "雪崩" },
            { text: "代码即法律", author: "劳伦斯·莱斯格", book: "代码2.0" },
            { text: "人工智能是人类发明的最后一项发明", author: "尼克·博斯特罗姆", book: "超级智能" },
            { text: "虚拟现实将成为最终的交流平台", author: "马克·扎克伯格", book: "连线采访" }
        ];

        let currentIndex = 0;

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        function updateCoords() {
            const lat = (34 + Math.random() * 0.01).toFixed(4);
            const lng = (118 + Math.random() * 0.01).toFixed(4);
            document.getElementById('coords').textContent = `${lat}°N, ${lng}°W`;
        }
        setInterval(updateCoords, 5000);

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');

            setTimeout(() => {
                textEl.textContent = quote.text;
                infoEl.innerHTML = `${quote.author} // ${quote.book}`;
                textEl.classList.add('show');
                infoEl.classList.add('show');
            }, 100);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        showQuote();
    </script>
</body>
</html>
