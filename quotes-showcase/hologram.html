<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全息投影效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #06060a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Noto Serif SC', monospace;
            overflow: hidden;
            position: relative;
        }
        /* 极简扫描线 */
        .scan-line {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 4px,
                rgba(100, 200, 180, 0.008) 4px,
                rgba(100, 200, 180, 0.008) 8px
            );
            pointer-events: none;
            z-index: 5;
        }
        .container {
            text-align: center;
            padding: 60px;
            max-width: 850px;
            position: relative;
            z-index: 10;
        }
        .hologram-frame {
            border: 1px solid rgba(100, 200, 180, 0.08);
            padding: 50px;
            position: relative;
            background: rgba(100, 200, 180, 0.005);
            box-shadow: 0 0 40px rgba(100, 200, 180, 0.02);
        }
        .hologram-frame::before,
        .hologram-frame::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border: 1px solid rgba(100, 200, 180, 0.15);
        }
        .hologram-frame::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }
        .hologram-frame::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }
        .corner {
            position: absolute;
            width: 8px;
            height: 8px;
            border: 1px solid rgba(100, 200, 180, 0.15);
        }
        .corner.tr {
            top: -1px;
            right: -1px;
            border-left: none;
            border-bottom: none;
        }
        .corner.bl {
            bottom: -1px;
            left: -1px;
            border-right: none;
            border-top: none;
        }
        .quote-text {
            font-size: 1.8rem;
            line-height: 1.9;
            color: rgba(160, 220, 200, 0.85);
            letter-spacing: 0.1em;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .quote-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        .quote-text .char {
            display: inline-block;
            opacity: 0;
            animation: charFade 0.5s ease forwards;
        }
        @keyframes charFade {
            to { opacity: 1; }
        }
        .divider {
            width: 60px;
            height: 1px;
            background: rgba(100, 200, 180, 0.1);
            margin: 40px auto 25px;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
        }
        .divider.show {
            opacity: 1;
        }
        .quote-info {
            font-size: 0.8rem;
            color: rgba(100, 200, 180, 0.35);
            letter-spacing: 0.2em;
            opacity: 0;
            transition: opacity 1.5s ease 0.8s;
        }
        .quote-info.show {
            opacity: 1;
        }
        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: rgba(100, 200, 180, 0.15);
            text-decoration: none;
            font-size: 0.8rem;
            z-index: 100;
            transition: color 0.5s;
            letter-spacing: 0.15em;
        }
        .back-link:hover { color: rgba(100, 200, 180, 0.4); }
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 100;
            opacity: 0.3;
            transition: opacity 0.5s;
        }
        .controls:hover { opacity: 1; }
        .btn {
            background: transparent;
            border: 1px solid rgba(100, 200, 180, 0.08);
            color: rgba(100, 200, 180, 0.25);
            padding: 10px 24px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.5s ease;
            letter-spacing: 0.1em;
            font-family: inherit;
        }
        .btn:hover {
            border-color: rgba(100, 200, 180, 0.18);
            color: rgba(100, 200, 180, 0.5);
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <a href="index.html" class="back-link">&larr; 返回</a>

    <div class="container">
        <div class="hologram-frame">
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="quote-text" id="quoteText"></div>
            <div class="divider" id="divider"></div>
            <div class="quote-info" id="quoteInfo">
                <span id="author"></span> &middot; <span id="book"></span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "我正在成为我自己", author: "刘慈欣", book: "三体" },
            { text: "宇宙很大，生活更大", author: "刘慈欣", book: "三体" },
            { text: "给岁月以文明，而不是给文明以岁月", author: "刘慈欣", book: "三体" },
            { text: "弱小和无知不是生存的障碍，傲慢才是", author: "刘慈欣", book: "三体" },
            { text: "不要回答！不要回答！不要回答！", author: "刘慈欣", book: "三体" },
            { text: "我们都是阴沟里的虫子，但总还是得有人仰望星空", author: "刘慈欣", book: "三体" }
        ];

        let currentIndex = 0;
        let autoPlayInterval = null;

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            const dividerEl = document.getElementById('divider');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');
            dividerEl.classList.remove('show');

            setTimeout(() => {
                textEl.innerHTML = '';
                const chars = quote.text.split('');
                chars.forEach((char, i) => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    span.style.animationDelay = (i * 0.05) + 's';
                    textEl.appendChild(span);
                });

                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;

                textEl.classList.add('show');
                setTimeout(() => {
                    dividerEl.classList.add('show');
                    infoEl.classList.add('show');
                }, 400);
            }, 400);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            autoPlayInterval = setInterval(nextQuote, 7000);
        }

        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') { nextQuote(); stopAutoPlay(); }
            if (e.key === 'ArrowLeft') { prevQuote(); stopAutoPlay(); }
        });

        document.addEventListener('mouseenter', stopAutoPlay, true);
        document.addEventListener('mouseleave', startAutoPlay, true);

        showQuote();
        startAutoPlay();
    </script>
</body>
</html>
