<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全息投影 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
            position: relative;
            perspective: 1000px;
        }
        /* 网格地面 */
        .grid-floor {
            position: fixed;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 100%;
            background:
                linear-gradient(90deg, rgba(0,255,255,0.1) 1px, transparent 1px),
                linear-gradient(rgba(0,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg);
            transform-origin: center top;
            animation: gridMove 10s linear infinite;
            z-index: 1;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }
        /* 扫描线 */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg,
                transparent,
                rgba(0,255,255,0.8),
                rgba(0,255,255,0.8),
                transparent
            );
            box-shadow: 0 0 20px rgba(0,255,255,0.5);
            animation: scan 4s ease-in-out infinite;
            z-index: 5;
        }
        @keyframes scan {
            0%, 100% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100vh; opacity: 0; }
        }
        /* 全息容器 */
        .hologram-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transform-style: preserve-3d;
        }
        .hologram-content {
            position: relative;
            padding: 60px 80px;
            transform-style: preserve-3d;
            animation: hologramFloat 3s ease-in-out infinite;
        }
        @keyframes hologramFloat {
            0%, 100% { transform: translateY(0) rotateX(5deg); }
            50% { transform: translateY(-20px) rotateX(-5deg); }
        }
        /* 全息边框 */
        .holo-frame {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(0,255,255,0.3);
            box-shadow:
                0 0 20px rgba(0,255,255,0.2),
                inset 0 0 20px rgba(0,255,255,0.1);
            animation: framePulse 2s ease-in-out infinite;
        }
        .holo-frame::before {
            content: '';
            position: absolute;
            inset: -10px;
            border: 1px solid rgba(0,255,255,0.1);
            animation: framePulse 2s ease-in-out infinite 0.5s;
        }
        @keyframes framePulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        /* 角落标记 */
        .corner-mark {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,255,255,0.6);
        }
        .corner-mark.tl { top: -5px; left: -5px; border-right: none; border-bottom: none; }
        .corner-mark.tr { top: -5px; right: -5px; border-left: none; border-bottom: none; }
        .corner-mark.bl { bottom: -5px; left: -5px; border-right: none; border-top: none; }
        .corner-mark.br { bottom: -5px; right: -5px; border-left: none; border-top: none; }
        .quote-text {
            font-size: clamp(1.4rem, 3vw, 2.4rem);
            line-height: 1.8;
            text-align: center;
            color: rgba(0, 255, 255, 0.9);
            text-shadow:
                0 0 5px rgba(0,255,255,0.8),
                0 0 10px rgba(0,255,255,0.5),
                0 0 20px rgba(0,255,255,0.3);
            letter-spacing: 0.1em;
            font-weight: 300;
            opacity: 0;
            transform: translateZ(50px);
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .quote-text.show {
            opacity: 1;
        }
        .quote-info {
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(0, 255, 255, 0.6);
            text-shadow: 0 0 10px rgba(0,255,255,0.3);
            letter-spacing: 0.15em;
            opacity: 0;
            transition: opacity 1s 0.3s;
        }
        .quote-info.show { opacity: 1; }
        .book-name {
            font-style: italic;
            opacity: 0.7;
        }
        /* 故障效果 */
        .glitch {
            position: relative;
        }
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch::before {
            color: #ff00ff;
            animation: glitch1 3s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }
        .glitch::after {
            color: #00ffff;
            animation: glitch2 3s infinite;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }
        @keyframes glitch1 {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-3px, 1px); }
            94% { transform: translate(3px, -1px); }
            96% { transform: translate(-2px, 2px); }
        }
        @keyframes glitch2 {
            0%, 90%, 100% { transform: translate(0); }
            91% { transform: translate(3px, -1px); }
            93% { transform: translate(-3px, 1px); }
            95% { transform: translate(2px, -2px); }
        }
        /* 控制按钮 */
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: rgba(0,255,255,0.08);
            border: 1px solid rgba(0,255,255,0.2);
            color: rgba(0,255,255,0.6);
            padding: 12px 32px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            letter-spacing: 0.1em;
            font-family: inherit;
            text-transform: uppercase;
        }
        .btn:hover {
            background: rgba(0,255,255,0.15);
            color: rgba(0,255,255,0.9);
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(0,255,255,0.3);
            text-decoration: none;
            font-size: 0.85rem;
            z-index: 100;
            transition: color 0.3s;
            letter-spacing: 0.1em;
        }
        .back-link:hover { color: rgba(0,255,255,0.7); }
        .settings-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(0,255,255,0.08);
            border: 1px solid rgba(0,255,255,0.15);
            color: rgba(0,255,255,0.5);
            width: 44px;
            height: 44px;
            border-radius: 0;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 100;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .settings-btn:hover {
            background: rgba(0,255,255,0.15);
            color: rgba(0,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }
        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100vh;
            background: rgba(0,10,15,0.95);
            backdrop-filter: blur(30px);
            z-index: 1000;
            transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 80px 30px 30px;
            overflow-y: auto;
            border-left: 1px solid rgba(0,255,255,0.1);
        }
        .settings-panel.open { right: 0; }
        .settings-panel h3 {
            color: rgba(0,255,255,0.8);
            font-size: 1rem;
            margin-bottom: 20px;
            letter-spacing: 0.1em;
        }
        .setting-item {
            margin-bottom: 25px;
        }
        .setting-item label {
            display: block;
            color: rgba(0,255,255,0.5);
            font-size: 0.8rem;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }
        .setting-item input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            background: rgba(0,255,255,0.1);
            border-radius: 2px;
            outline: none;
        }
        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: rgba(0,255,255,0.8);
            border-radius: 0;
            cursor: pointer;
        }
        .close-settings {
            position: absolute;
            top: 30px;
            right: 30px;
            background: none;
            border: none;
            color: rgba(0,255,255,0.5);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
    .codex-return-home{position:fixed;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));z-index:99999;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(5,5,7,.46);color:rgba(255,255,255,.86);text-decoration:none;font:600 13px/1.1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.04em;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 1px rgba(255,255,255,.12)}.codex-return-home:hover{border-color:rgba(0,232,138,.42);color:#00e88a}@media(max-width:640px){.codex-return-home{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));min-height:34px;padding:7px 11px;font-size:12px}}
</style>
</head>
<body>
    <a class="codex-return-home" href="../#quotes" onclick="sessionStorage.setItem('returnToQuoteShowcase','true')">← 返回主页</a>

    <div class="grid-floor"></div>
    <div class="scan-line"></div>

    <a href="index.html" class="back-link">← 返回</a>
    <button class="settings-btn" onclick="toggleSettings()">⚙</button>

    <div class="overlay" id="overlay" onclick="toggleSettings()"></div>
    <div class="settings-panel" id="settingsPanel">
        <button class="close-settings" onclick="toggleSettings()">×</button>
        <h3>阅读设置</h3>
        <div class="setting-item">
            <label>字号大小</label>
            <input type="range" min="12" max="32" value="20" id="fontSizeSlider" onchange="updateFontSize()">
        </div>
        <div class="setting-item">
            <label>故障效果强度</label>
            <input type="range" min="0" max="10" value="5" id="glitchSlider" onchange="updateGlitch()">
        </div>
    </div>

    <div class="hologram-container">
        <div class="hologram-content">
            <div class="holo-frame"></div>
            <div class="corner-mark tl"></div>
            <div class="corner-mark tr"></div>
            <div class="corner-mark bl"></div>
            <div class="corner-mark br"></div>
            <div class="quote-text glitch" id="quoteText" data-text=""></div>
            <div class="quote-info" id="quoteInfo"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "未来已来，只是分布不均", author: "威廉·吉布森", book: "神经漫游者" },
            { text: "科技是人类的延伸，也是人类的镜子", author: "马歇尔·麦克卢汉", book: "理解媒介" },
            { text: "在数字世界中，信息就是力量", author: "尼尔·斯蒂芬森", book: "雪崩" },
            { text: "虚拟现实将成为最终的交流平台", author: "马克·扎克伯格", book: "连线采访" },
            { text: "人工智能是人类发明的最后一项发明", author: "尼克·博斯特罗姆", book: "超级智能" },
            { text: "代码即法律", author: "劳伦斯·莱斯格", book: "代码2.0" }
        ];

        let currentIndex = 0;

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');

            setTimeout(() => {
                textEl.textContent = quote.text;
                textEl.setAttribute('data-text', quote.text);
                infoEl.innerHTML = `${quote.author} · <span class="book-name">${quote.book}</span>`;
                textEl.classList.add('show');
                infoEl.classList.add('show');
            }, 300);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function updateFontSize() {
            const size = document.getElementById('fontSizeSlider').value;
            document.getElementById('quoteText').style.fontSize = size + 'px';
        }

        function updateGlitch() {
            const intensity = document.getElementById('glitchSlider').value;
            const textEl = document.getElementById('quoteText');
            if (intensity < 3) {
                textEl.classList.remove('glitch');
            } else {
                textEl.classList.add('glitch');
                const duration = 4 - (intensity / 10) * 3;
                textEl.style.animationDuration = duration + 's';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        showQuote();
    </script>
</body>
</html>
