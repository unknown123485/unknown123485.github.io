<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全息投影效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Noto Serif SC', monospace;
            overflow: hidden;
            position: relative;
        }
        /* 扫描线 */
        .scan-line {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 200, 0.02) 2px,
                rgba(0, 255, 200, 0.02) 4px
            );
            pointer-events: none;
            z-index: 5;
        }
        /* 扫描光束 */
        .scan-beam {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 200, 0.4), transparent);
            animation: scanMove 3s ease-in-out infinite;
            z-index: 6;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.3);
        }
        @keyframes scanMove {
            0%, 100% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100vh; opacity: 0; }
        }
        /* 全息底座 */
        .hologram-base {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 100px;
            background: radial-gradient(ellipse at 50% 50%, rgba(0, 255, 200, 0.1) 0%, transparent 70%);
            z-index: 2;
        }
        .hologram-base::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 20px;
            background: radial-gradient(ellipse at 50% 50%, rgba(0, 255, 200, 0.3) 0%, transparent 70%);
            border-radius: 50%;
        }
        /* 全息框架 */
        .hologram-frame {
            border: 1px solid rgba(0, 255, 200, 0.2);
            padding: 60px;
            position: relative;
            background: rgba(0, 255, 200, 0.02);
            box-shadow:
                0 0 60px rgba(0, 255, 200, 0.05),
                inset 0 0 60px rgba(0, 255, 200, 0.02);
            animation: framePulse 3s ease-in-out infinite;
            z-index: 10;
        }
        @keyframes framePulse {
            0%, 100% { 
                box-shadow: 0 0 60px rgba(0, 255, 200, 0.05), inset 0 0 60px rgba(0, 255, 200, 0.02);
                border-color: rgba(0, 255, 200, 0.2);
            }
            50% { 
                box-shadow: 0 0 100px rgba(0, 255, 200, 0.1), inset 0 0 80px rgba(0, 255, 200, 0.05);
                border-color: rgba(0, 255, 200, 0.3);
            }
        }
        /* 角落装饰 */
        .hologram-frame::before,
        .hologram-frame::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(0, 255, 200, 0.4);
        }
        .hologram-frame::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }
        .hologram-frame::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(0, 255, 200, 0.4);
        }
        .corner.tl { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .corner.br { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        /* 故障效果 */
        .glitch {
            position: relative;
        }
        .glitch.active::before,
        .glitch.active::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch.active::before {
            animation: glitch1 0.2s ease;
            color: rgba(255, 0, 100, 0.6);
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
        }
        .glitch.active::after {
            animation: glitch2 0.2s ease;
            color: rgba(0, 255, 200, 0.6);
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
        }
        @keyframes glitch1 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-5px, 2px); }
            40% { transform: translate(5px, -2px); }
            60% { transform: translate(-3px, 1px); }
            80% { transform: translate(3px, -1px); }
        }
        @keyframes glitch2 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(5px, -2px); }
            40% { transform: translate(-5px, 2px); }
            60% { transform: translate(3px, -1px); }
            80% { transform: translate(-3px, 1px); }
        }
        .quote-text {
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            line-height: 1.8;
            color: rgba(0, 255, 200, 0.9);
            letter-spacing: 0.12em;
            position: relative;
            opacity: 0;
            transform: translateY(25px);
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            text-shadow:
                0 0 10px rgba(0, 255, 200, 0.5),
                0 0 20px rgba(0, 255, 200, 0.3),
                0 0 40px rgba(0, 255, 200, 0.1);
        }
        .quote-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        .quote-text .char {
            display: inline-block;
            opacity: 0;
            animation: charFade 0.4s ease forwards;
        }
        @keyframes charFade {
            to { opacity: 1; }
        }
        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 200, 0.5), transparent);
            margin: 35px auto 20px;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
            box-shadow: 0 0 10px rgba(0, 255, 200, 0.3);
        }
        .divider.show {
            opacity: 1;
        }
        .quote-info {
            font-size: 0.8rem;
            color: rgba(0, 255, 200, 0.5);
            letter-spacing: 0.2em;
            opacity: 0;
            transition: opacity 1.5s ease 0.8s;
            font-weight: 300;
        }
        .quote-info.show {
            opacity: 1;
        }
        /* 数据装饰 */
        .data-deco {
            position: fixed;
            font-size: 0.65rem;
            color: rgba(0, 255, 200, 0.2);
            letter-spacing: 0.1em;
            font-family: 'Courier New', monospace;
            z-index: 100;
        }
        .data-deco.tl { top: 20px; left: 20px; }
        .data-deco.tr { top: 20px; right: 20px; }
        .data-deco.bl { bottom: 20px; left: 20px; }
        .data-deco.br { bottom: 20px; right: 20px; }
        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: rgba(0, 255, 200, 0.3);
            text-decoration: none;
            font-size: 0.75rem;
            z-index: 100;
            transition: all 0.6s;
            letter-spacing: 0.15em;
            font-weight: 300;
        }
        .back-link:hover { color: rgba(0, 255, 200, 0.8); }
        .controls {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: transparent;
            border: 1px solid rgba(0, 255, 200, 0.15);
            color: rgba(0, 255, 200, 0.4);
            padding: 10px 24px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 0.1em;
            font-family: inherit;
            font-weight: 300;
        }
        .btn:hover {
            border-color: rgba(0, 255, 200, 0.4);
            color: rgba(0, 255, 200, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.1);
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div class="scan-beam"></div>
    <div class="hologram-base"></div>
    <a href="index.html" class="back-link">&larr; 返回</a>

    <div class="data-deco tl">SYS.HOLOGRAM.v2.7</div>
    <div class="data-deco tr">RENDER: ACTIVE</div>
    <div class="data-deco bl">COORD: 34.0522°N, 118.2437°W</div>
    <div class="data-deco br">STATUS: ONLINE</div>

    <div class="hologram-frame">
        <div class="corner tl"></div>
        <div class="corner br"></div>
        <div class="quote-text glitch" id="quoteText" data-text=""></div>
        <div class="divider" id="divider"></div>
        <div class="quote-info" id="quoteInfo">
            <span id="author"></span> &middot; <span id="book"></span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "我正在成为我自己", author: "伍尔夫", book: "达洛维夫人" },
            { text: "未来已来，只是分布不均", author: "吉布森", book: "神经漫游者" },
            { text: "在数字的海洋中，我们寻找人性的灯塔", author: "斯蒂格勒", book: "技术与时间" },
            { text: "虚拟与现实的边界，正在消融", author: "鲍德里亚", book: "拟像与仿真" },
            { text: "代码是新时代的诗歌", author: "维纳", book: "控制论" },
            { text: "在硅基世界里，碳基生命依然闪耀", author: "库兹韦尔", book: "奇点临近" }
        ];

        let currentIndex = 0;

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            const dividerEl = document.getElementById('divider');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');
            dividerEl.classList.remove('show');
            textEl.classList.remove('active');

            setTimeout(() => {
                textEl.innerHTML = '';
                textEl.setAttribute('data-text', quote.text);
                const chars = quote.text.split('');
                chars.forEach((char, i) => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    span.style.animationDelay = (i * 0.03) + 's';
                    textEl.appendChild(span);
                });

                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;

                textEl.classList.add('show');

                setTimeout(() => {
                    textEl.classList.add('active');
                    setTimeout(() => textEl.classList.remove('active'), 200);
                }, 800);

                setTimeout(() => {
                    dividerEl.classList.add('show');
                    infoEl.classList.add('show');
                }, 500);
            }, 400);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        // 随机故障效果
        setInterval(() => {
            const textEl = document.getElementById('quoteText');
            if (textEl.classList.contains('show') && Math.random() > 0.7) {
                textEl.classList.add('active');
                setTimeout(() => textEl.classList.remove('active'), 200);
            }
        }, 4000);

        showQuote();
    </script>
</body>
</html>
