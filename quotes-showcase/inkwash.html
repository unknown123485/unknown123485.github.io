<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水墨书香 - 书摘展示</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f7f5f0;
            font-family: 'Noto Serif SC', serif;
            overflow-x: hidden;
            position: relative;
        }

        /* 宣纸纹理 - 更细腻 */
        .paper-texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        }

        /* 水墨晕染背景 */
        .ink-wash-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ink-wash-bg::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse at center, rgba(180, 170, 160, 0.15) 0%, transparent 70%);
            filter: blur(60px);
        }

        .ink-wash-bg::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 50%;
            height: 50%;
            background: radial-gradient(ellipse at center, rgba(160, 150, 140, 0.12) 0%, transparent 70%);
            filter: blur(80px);
        }

        /* 顶部装饰线 */
        .top-decoration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(139, 115, 85, 0.3) 20%, 
                rgba(139, 115, 85, 0.3) 80%, 
                transparent 100%);
            z-index: 10;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 40px 60px;
            position: relative;
            z-index: 5;
        }

        /* 标题区域 - 更简洁 */
        .header {
            text-align: center;
            margin-bottom: 80px;
            position: relative;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 300;
            color: #4a4540;
            letter-spacing: 0.4em;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #9a8a7a;
            letter-spacing: 0.3em;
            font-weight: 300;
        }

        .header-line {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #9a8a7a, transparent);
            margin: 30px auto;
        }

        /* 书摘卡片 - 极简风格 */
        .quote-card {
            position: relative;
            padding: 60px 50px;
            margin-bottom: 50px;
            background: rgba(255, 253, 248, 0.6);
            border: none;
        }

        .quote-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 115, 85, 0.4), transparent);
        }

        .quote-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 115, 85, 0.4), transparent);
        }

        .quote-text {
            font-size: 1.35rem;
            line-height: 2.4;
            color: #3a3530;
            text-align: justify;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        /* 首字下沉 - 更优雅 */
        .quote-text::first-letter {
            font-size: 2.8rem;
            float: left;
            margin-right: 12px;
            line-height: 1.3;
            color: #5a4a3a;
            font-weight: 600;
        }

        /* 书籍信息 */
        .book-info {
            text-align: center;
            margin-top: 50px;
            padding-top: 30px;
            position: relative;
        }

        .book-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 1px;
            background: rgba(139, 115, 85, 0.3);
        }

        .book-title {
            font-size: 1.1rem;
            color: #6a5a4a;
            margin-bottom: 8px;
            letter-spacing: 0.15em;
            font-weight: 400;
        }

        .book-author {
            font-size: 0.85rem;
            color: #9a8a7a;
            letter-spacing: 0.1em;
            font-weight: 300;
        }

        /* 导航 */
        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-top: 60px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(139, 115, 85, 0.25);
            color: #7a6a5a;
            padding: 10px 28px;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 0.1em;
            font-weight: 300;
        }

        .nav-btn:hover {
            border-color: rgba(139, 115, 85, 0.5);
            color: #4a3a2a;
            background: rgba(139, 115, 85, 0.05);
        }

        .nav-indicator {
            color: #9a8a7a;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            font-weight: 300;
        }

        /* 返回按钮 */
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(0,0,0,0.25);
            text-decoration: none;
            font-size: 0.85rem;
            z-index: 100;
            transition: color 0.3s;
            letter-spacing: 0.1em;
            font-weight: 300;
        }

        .back-link:hover { 
            color: rgba(0,0,0,0.5); 
        }

        /* 页码 */
        .page-number {
            position: fixed;
            bottom: 30px;
            right: 40px;
            color: rgba(139, 115, 85, 0.4);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            font-weight: 300;
        }

        /* 淡入动画 */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .container {
                padding: 60px 25px 40px;
            }

            .title {
                font-size: 1.6rem;
                letter-spacing: 0.2em;
            }

            .quote-card {
                padding: 40px 25px;
            }

            .quote-text {
                font-size: 1.15rem;
                line-height: 2.2;
            }

            .quote-text::first-letter {
                font-size: 2.2rem;
            }
        }
    .codex-return-home{position:fixed;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));z-index:99999;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(5,5,7,.46);color:rgba(255,255,255,.86);text-decoration:none;font:600 13px/1.1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.04em;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 1px rgba(255,255,255,.12)}.codex-return-home:hover{border-color:rgba(0,232,138,.42);color:#00e88a}@media(max-width:640px){.codex-return-home{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));min-height:34px;padding:7px 11px;font-size:12px}}
</style>
</head>
<body>
    <a class="codex-return-home" href="../#quotes" onclick="sessionStorage.setItem('returnToQuoteShowcase','true')">← 返回主页</a>

    <div class="paper-texture"></div>
    <div class="ink-wash-bg"></div>
    <div class="top-decoration"></div>

    <a href="index.html" class="back-link">← 返回</a>

    <div class="container">
        <div class="header fade-in">
            <h1 class="title">墨韵书香</h1>
            <p class="subtitle">静读经典 · 品味文字</p>
            <div class="header-line"></div>
        </div>

        <article class="quote-card fade-in" id="quoteCard">
            <div class="quote-text" id="quoteText"></div>
            <div class="book-info">
                <p class="book-title" id="bookTitle"></p>
                <p class="book-author" id="bookAuthor"></p>
            </div>
        </article>

        <div class="navigation">
            <button class="nav-btn" onclick="prevQuote()">上一则</button>
            <span class="nav-indicator"><span id="currentIndex">1</span> / <span id="totalCount">5</span></span>
            <button class="nav-btn" onclick="nextQuote()">下一则</button>
        </div>
    </div>

    <div class="page-number" id="pageNumber">壹</div>

    <script>
        const quotes = [
            { text: "人生天地之间，若白驹之过隙，忽然而已。注然勃然，莫不出焉；油然寥然，莫之令止。吾生也有涯，而知也无涯。以有涯随无涯，殆已！已而为知者，殆而已矣！", author: "庄周", book: "《庄子 · 内篇》" },
            { text: "大道至简，大音希声，大象无形。知者不言，言者不知。塞其兑，闭其门，挫其锐，解其纷，和其光，同其尘。", author: "老子", book: "《道德经》" },
            { text: "不以物喜，不以己悲。居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？", author: "范仲淹", book: "《岳阳楼记》" },
            { text: "山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。", author: "刘禹锡", book: "《陋室铭》" },
            { text: "世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间。", author: "韩愈", book: "《马说》" }
        ];

        const chineseNumbers = ['壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖', '拾'];

        let currentIndex = 0;

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const titleEl = document.getElementById('bookTitle');
            const authorEl = document.getElementById('bookAuthor');
            const cardEl = document.getElementById('quoteCard');

            cardEl.classList.remove('visible');

            setTimeout(() => {
                textEl.textContent = quote.text;
                titleEl.textContent = quote.book;
                authorEl.textContent = quote.author;
                document.getElementById('currentIndex').textContent = currentIndex + 1;
                document.getElementById('pageNumber').textContent = chineseNumbers[currentIndex] || (currentIndex + 1);
                cardEl.classList.add('visible');
            }, 300);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('totalCount').textContent = quotes.length;
            showQuote();

            // 标题淡入
            setTimeout(() => {
                document.querySelector('.header').classList.add('visible');
            }, 200);
        });

        // 键盘导航
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });
    </script>
</body>
</html>
