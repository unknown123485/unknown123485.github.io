<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹灯管效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', 'Georgia', serif;
            overflow: hidden;
            position: relative;
        }
        /* 背景霓虹光晕 */
        .neon-bg {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 0, 128, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(0, 255, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(128, 0, 255, 0.1) 0%, transparent 50%),
                #0a0a0f;
            z-index: 0;
        }
        /* 霓虹灯管边框效果 */
        .neon-container {
            position: relative;
            padding: 80px 100px;
            z-index: 10;
        }
        .neon-border {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 0, 128, 0.3);
            border-radius: 20px;
            box-shadow: 
                0 0 20px rgba(255, 0, 128, 0.2),
                inset 0 0 20px rgba(255, 0, 128, 0.1);
            animation: borderPulse 3s ease-in-out infinite;
        }
        @keyframes borderPulse {
            0%, 100% { 
                border-color: rgba(255, 0, 128, 0.3);
                box-shadow: 0 0 20px rgba(255, 0, 128, 0.2), inset 0 0 20px rgba(255, 0, 128, 0.1);
            }
            33% { 
                border-color: rgba(0, 255, 255, 0.3);
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.1);
            }
            66% { 
                border-color: rgba(128, 0, 255, 0.3);
                box-shadow: 0 0 20px rgba(128, 0, 255, 0.2), inset 0 0 20px rgba(128, 0, 255, 0.1);
            }
        }
        /* 角落霓虹灯 */
        .neon-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            z-index: 11;
        }
        .neon-corner::before,
        .neon-corner::after {
            content: '';
            position: absolute;
            background: #ff0080;
            box-shadow: 0 0 10px #ff0080, 0 0 20px #ff0080, 0 0 30px #ff0080;
            animation: cornerColor 3s ease-in-out infinite;
        }
        @keyframes cornerColor {
            0%, 100% { background: #ff0080; box-shadow: 0 0 10px #ff0080, 0 0 20px #ff0080; }
            33% { background: #00ffff; box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
            66% { background: #8000ff; box-shadow: 0 0 10px #8000ff, 0 0 20px #8000ff; }
        }
        .neon-corner.tl { top: -5px; left: -5px; }
        .neon-corner.tl::before { top: 0; left: 0; width: 30px; height: 3px; }
        .neon-corner.tl::after { top: 0; left: 0; width: 3px; height: 30px; }
        .neon-corner.tr { top: -5px; right: -5px; }
        .neon-corner.tr::before { top: 0; right: 0; width: 30px; height: 3px; }
        .neon-corner.tr::after { top: 0; right: 0; width: 3px; height: 30px; }
        .neon-corner.bl { bottom: -5px; left: -5px; }
        .neon-corner.bl::before { bottom: 0; left: 0; width: 30px; height: 3px; }
        .neon-corner.bl::after { bottom: 0; left: 0; width: 3px; height: 30px; }
        .neon-corner.br { bottom: -5px; right: -5px; }
        .neon-corner.br::before { bottom: 0; right: 0; width: 30px; height: 3px; }
        .neon-corner.br::after { bottom: 0; right: 0; width: 3px; height: 30px; }
        
        .quote-text {
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            line-height: 1.6;
            color: #fff;
            letter-spacing: 0.15em;
            font-weight: 300;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s cubic-bezier(0.22, 1, 0.36, 1);
            /* 多层霓虹发光 */
            text-shadow:
                0 0 5px rgba(255, 0, 128, 0.8),
                0 0 10px rgba(255, 0, 128, 0.6),
                0 0 20px rgba(255, 0, 128, 0.4),
                0 0 40px rgba(255, 0, 128, 0.2),
                0 0 80px rgba(255, 0, 128, 0.1);
            animation: neonColor 3s ease-in-out infinite;
        }
        @keyframes neonColor {
            0%, 100% { 
                text-shadow: 0 0 5px rgba(255, 0, 128, 0.8), 0 0 10px rgba(255, 0, 128, 0.6), 0 0 20px rgba(255, 0, 128, 0.4), 0 0 40px rgba(255, 0, 128, 0.2);
            }
            33% { 
                text-shadow: 0 0 5px rgba(0, 255, 255, 0.8), 0 0 10px rgba(0, 255, 255, 0.6), 0 0 20px rgba(0, 255, 255, 0.4), 0 0 40px rgba(0, 255, 255, 0.2);
            }
            66% { 
                text-shadow: 0 0 5px rgba(128, 0, 255, 0.8), 0 0 10px rgba(128, 0, 255, 0.6), 0 0 20px rgba(128, 0, 255, 0.4), 0 0 40px rgba(128, 0, 255, 0.2);
            }
        }
        .quote-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        .quote-text .char {
            display: inline-block;
            opacity: 0;
            animation: charReveal 0.6s ease forwards;
        }
        @keyframes charReveal {
            to { opacity: 1; }
        }
        .divider {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff0080, transparent);
            margin: 40px auto 25px;
            opacity: 0;
            transition: opacity 1.5s ease 0.8s;
            box-shadow: 0 0 10px #ff0080, 0 0 20px #ff0080;
            animation: dividerColor 3s ease-in-out infinite;
        }
        @keyframes dividerColor {
            0%, 100% { background: linear-gradient(90deg, transparent, #ff0080, transparent); box-shadow: 0 0 10px #ff0080; }
            33% { background: linear-gradient(90deg, transparent, #00ffff, transparent); box-shadow: 0 0 10px #00ffff; }
            66% { background: linear-gradient(90deg, transparent, #8000ff, transparent); box-shadow: 0 0 10px #8000ff; }
        }
        .divider.show {
            opacity: 1;
        }
        .quote-info {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.3em;
            opacity: 0;
            transition: opacity 1.5s ease 1.2s;
            font-weight: 300;
            text-align: center;
        }
        .quote-info.show {
            opacity: 1;
        }
        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-size: 0.8rem;
            transition: all 0.6s;
            z-index: 100;
            letter-spacing: 0.2em;
        }
        .back-link:hover {
            color: #ff0080;
            text-shadow: 0 0 10px #ff0080;
        }
        .controls {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: transparent;
            border: 1px solid rgba(255, 0, 128, 0.3);
            color: rgba(255, 255, 255, 0.5);
            padding: 14px 36px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.6s;
            letter-spacing: 0.2em;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            border-color: #ff0080;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.3);
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
        }
    </style>
</head>
<body>
    <div class="neon-bg"></div>
    <a href="index.html" class="back-link">&larr; 返回</a>

    <div class="neon-container">
        <div class="neon-border"></div>
        <div class="neon-corner tl"></div>
        <div class="neon-corner tr"></div>
        <div class="neon-corner bl"></div>
        <div class="neon-corner br"></div>
        <div class="quote-text" id="quoteText"></div>
        <div class="divider" id="divider"></div>
        <div class="quote-info" id="quoteInfo">
            <span id="author"></span> &middot; <span id="book"></span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "霓虹之下，我们都是孤独的舞者", author: "村上春树", book: "挪威的森林" },
            { text: "城市是一座巨大的迷宫", author: "博尔赫斯", book: "迷宫" },
            { text: "黑夜给了我黑色的眼睛", author: "顾城", book: "一代人" },
            { text: "在赛博朋克的世界里", author: "威廉·吉布森", book: "神经漫游者" },
            { text: "霓虹灯下的阴影里", author: "菲茨杰拉德", book: "了不起的盖茨比" }
        ];

        let currentIndex = 0;

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            const dividerEl = document.getElementById('divider');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');
            dividerEl.classList.remove('show');

            setTimeout(() => {
                textEl.innerHTML = '';
                const chars = quote.text.split('');
                chars.forEach((char, i) => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    span.style.animationDelay = (i * 0.08) + 's';
                    textEl.appendChild(span);
                });

                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;

                textEl.classList.add('show');
                setTimeout(() => {
                    dividerEl.classList.add('show');
                    infoEl.classList.add('show');
                }, 600);
            }, 500);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        showQuote();
    </script>
</body>
</html>
