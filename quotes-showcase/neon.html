<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹灯管效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050508;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            position: relative;
        }
        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 120%, rgba(100, 60, 160, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 30% 50%, rgba(160, 60, 120, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 50%, rgba(40, 80, 180, 0.03) 0%, transparent 50%),
                #050508;
            z-index: 0;
        }
        .container {
            text-align: center;
            padding: 40px 60px;
            max-width: 90vw;
            width: 100%;
            position: relative;
            z-index: 10;
        }
        .quote-mark {
            font-size: 10rem;
            color: rgba(160, 120, 220, 0.03);
            line-height: 0.3;
            margin-bottom: 20px;
            font-family: Georgia, serif;
            font-weight: 300;
            user-select: none;
        }
        .quote-text {
            font-size: clamp(1.5rem, 3vw, 2.8rem);
            line-height: 1.8;
            color: rgba(230, 220, 255, 0.85);
            letter-spacing: 0.1em;
            font-weight: 300;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s cubic-bezier(0.22, 1, 0.36, 1);
            text-shadow:
                0 0 5px rgba(160, 120, 220, 0.4),
                0 0 10px rgba(160, 120, 220, 0.2),
                0 0 20px rgba(160, 120, 220, 0.1);
        }
        .quote-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        .quote-text.flicker {
            animation: neonFlicker 5s ease-in-out infinite;
        }
        @keyframes neonFlicker {
            0%, 100% { opacity: 1; }
            5% { opacity: 0.98; }
            10% { opacity: 1; }
            15% { opacity: 0.97; }
            20% { opacity: 1; }
            50% { opacity: 0.99; }
            52% { opacity: 0.95; }
            54% { opacity: 0.99; }
            90% { opacity: 1; }
            92% { opacity: 0.97; }
            94% { opacity: 1; }
        }
        .quote-text .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(15px);
            animation: charReveal 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes charReveal {
            to { opacity: 1; transform: translateY(0); }
        }
        .divider {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(160, 120, 220, 0.3), transparent);
            margin: 40px auto 25px;
            opacity: 0;
            transition: opacity 2s ease 0.8s;
            box-shadow: 0 0 8px rgba(160, 120, 220, 0.15);
        }
        .divider.show {
            opacity: 1;
        }
        .quote-info {
            font-size: 0.85rem;
            color: rgba(160, 140, 200, 0.4);
            letter-spacing: 0.3em;
            opacity: 0;
            transition: opacity 2s ease 1.2s;
            font-weight: 300;
        }
        .quote-info.show {
            opacity: 1;
        }
        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: rgba(255, 255, 255, 0.15);
            text-decoration: none;
            font-size: 0.75rem;
            transition: all 0.6s;
            z-index: 100;
            letter-spacing: 0.2em;
            font-weight: 300;
        }
        .back-link:hover {
            color: rgba(160, 120, 220, 0.6);
            text-shadow: 0 0 15px rgba(160, 120, 220, 0.3);
        }
        .controls {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: transparent;
            border: 1px solid rgba(160, 120, 220, 0.1);
            color: rgba(160, 140, 200, 0.35);
            padding: 14px 36px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 0.2em;
            font-family: inherit;
            font-weight: 300;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(160, 120, 220, 0.08), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        .btn:hover {
            border-color: rgba(160, 120, 220, 0.3);
            color: rgba(160, 140, 200, 0.7);
            box-shadow: 0 0 20px rgba(160, 120, 220, 0.1);
        }
        .btn:hover::before {
            transform: translateX(100%);
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <a href="index.html" class="back-link">&larr; 返回</a>

    <div class="container">
        <div class="quote-mark">"</div>
        <div class="quote-text" id="quoteText"></div>
        <div class="divider" id="divider"></div>
        <div class="quote-info" id="quoteInfo">
            <span id="author"></span> &middot; <span id="book"></span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "霓虹之下，我们都是孤独的舞者", author: "村上春树", book: "挪威的森林" },
            { text: "城市是一座巨大的迷宫，我们在其中寻找出口", author: "博尔赫斯", book: "迷宫" },
            { text: "黑夜给了我黑色的眼睛，我却用它寻找光明", author: "顾城", book: "一代人" },
            { text: "我们都是夜行动物，在城市的霓虹中觅食", author: "雷蒙德·钱德勒", book: "漫长的告别" },
            { text: "在赛博朋克的世界里，每个人都是自己的黑客", author: "威廉·吉布森", book: "神经漫游者" },
            { text: "霓虹灯下的阴影里，藏着最真实的我们", author: "菲茨杰拉德", book: "了不起的盖茨比" }
        ];

        let currentIndex = 0;

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            const dividerEl = document.getElementById('divider');

            textEl.classList.remove('show', 'flicker');
            infoEl.classList.remove('show');
            dividerEl.classList.remove('show');

            setTimeout(() => {
                textEl.innerHTML = '';
                const chars = quote.text.split('');
                chars.forEach((char, i) => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    span.style.animationDelay = (i * 0.05) + 's';
                    textEl.appendChild(span);
                });

                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;

                textEl.classList.add('show');
                setTimeout(() => {
                    textEl.classList.add('flicker');
                    dividerEl.classList.add('show');
                    infoEl.classList.add('show');
                }, 600);
            }, 500);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        showQuote();
    </script>
</body>
</html>
