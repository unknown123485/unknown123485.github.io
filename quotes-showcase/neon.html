<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹灯管效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', 'Georgia', serif;
            overflow: hidden;
            position: relative;
        }
        /* 深邃背景 - 多层径向渐变营造空间感 */
        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% 120%, rgba(120, 50, 200, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 30% 50%, rgba(200, 50, 150, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 70% 50%, rgba(50, 100, 220, 0.05) 0%, transparent 50%),
                #000;
            z-index: 0;
        }
        /* 微妙的颗粒纹理 */
        .bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            opacity: 0.4;
            pointer-events: none;
        }
        .container {
            text-align: center;
            padding: 60px;
            max-width: 900px;
            position: relative;
            z-index: 10;
        }
        /* 装饰引号 - 巨大但极淡 */
        .quote-mark {
            font-size: 12rem;
            color: rgba(180, 120, 255, 0.06);
            line-height: 0.3;
            margin-bottom: 20px;
            font-family: 'Times New Roman', serif;
            font-weight: 300;
            user-select: none;
        }
        /* 核心文字 - 真正的霓虹发光效果 */
        .quote-text {
            font-size: 2.4rem;
            line-height: 2;
            color: #fff;
            letter-spacing: 0.12em;
            font-weight: 300;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s cubic-bezier(0.22, 1, 0.36, 1);
            /* 多层发光 - 模拟真实霓虹灯管 */
            text-shadow:
                0 0 7px rgba(180, 120, 255, 0.8),
                0 0 15px rgba(180, 120, 255, 0.6),
                0 0 30px rgba(180, 120, 255, 0.4),
                0 0 60px rgba(180, 120, 255, 0.2),
                0 0 100px rgba(180, 120, 255, 0.1);
        }
        .quote-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        /* 文字闪烁动画 - 模拟霓虹灯管的不稳定 */
        .quote-text.flicker {
            animation: neonFlicker 4s ease-in-out infinite;
        }
        @keyframes neonFlicker {
            0%, 100% { opacity: 1; }
            5% { opacity: 0.95; }
            10% { opacity: 1; }
            15% { opacity: 0.9; }
            20% { opacity: 1; }
            50% { opacity: 0.98; }
            52% { opacity: 0.85; }
            54% { opacity: 0.98; }
            90% { opacity: 1; }
            92% { opacity: 0.9; }
            94% { opacity: 1; }
        }
        .quote-text .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(15px);
            animation: charReveal 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes charReveal {
            to { opacity: 1; transform: translateY(0); }
        }
        /* 精致分隔线 - 发光效果 */
        .divider {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(180, 120, 255, 0.5), transparent);
            margin: 50px auto 30px;
            opacity: 0;
            transition: opacity 2s ease 0.8s;
            box-shadow: 0 0 10px rgba(180, 120, 255, 0.3);
        }
        .divider.show {
            opacity: 1;
        }
        .quote-info {
            font-size: 0.85rem;
            color: rgba(180, 160, 220, 0.5);
            letter-spacing: 0.3em;
            opacity: 0;
            transition: opacity 2s ease 1.2s;
            font-weight: 300;
        }
        .quote-info.show {
            opacity: 1;
        }
        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            font-size: 0.75rem;
            transition: all 0.6s;
            z-index: 100;
            letter-spacing: 0.2em;
            font-weight: 300;
        }
        .back-link:hover {
            color: rgba(180, 120, 255, 0.8);
            text-shadow: 0 0 20px rgba(180, 120, 255, 0.5);
        }
        .controls {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: transparent;
            border: 1px solid rgba(180, 120, 255, 0.15);
            color: rgba(180, 160, 220, 0.4);
            padding: 14px 36px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 0.2em;
            font-family: inherit;
            font-weight: 300;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(180, 120, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        .btn:hover {
            border-color: rgba(180, 120, 255, 0.4);
            color: rgba(180, 160, 220, 0.8);
            box-shadow: 0 0 30px rgba(180, 120, 255, 0.15);
        }
        .btn:hover::before {
            transform: translateX(100%);
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <a href="index.html" class="back-link">&larr; 返回</a>

    <div class="container">
        <div class="quote-mark">"</div>
        <div class="quote-text" id="quoteText"></div>
        <div class="divider" id="divider"></div>
        <div class="quote-info" id="quoteInfo">
            <span id="author"></span> &middot; <span id="book"></span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "霓虹之下，我们都是孤独的舞者", author: "村上春树", book: "挪威的森林" },
            { text: "城市是一座巨大的迷宫，我们在其中寻找出口", author: "博尔赫斯", book: "迷宫" },
            { text: "黑夜给了我黑色的眼睛，我却用它寻找光明", author: "顾城", book: "一代人" },
            { text: "我们都是夜行动物，在城市的霓虹中觅食", author: "雷蒙德·钱德勒", book: "漫长的告别" },
            { text: "在赛博朋克的世界里，每个人都是自己的黑客", author: "威廉·吉布森", book: "神经漫游者" },
            { text: "霓虹灯下的阴影里，藏着最真实的我们", author: "菲茨杰拉德", book: "了不起的盖茨比" }
        ];

        let currentIndex = 0;

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            const dividerEl = document.getElementById('divider');

            textEl.classList.remove('show', 'flicker');
            infoEl.classList.remove('show');
            dividerEl.classList.remove('show');

            setTimeout(() => {
                textEl.innerHTML = '';
                const chars = quote.text.split('');
                chars.forEach((char, i) => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    span.style.animationDelay = (i * 0.05) + 's';
                    textEl.appendChild(span);
                });

                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;

                textEl.classList.add('show');
                setTimeout(() => {
                    textEl.classList.add('flicker');
                    dividerEl.classList.add('show');
                    infoEl.classList.add('show');
                }, 600);
            }, 500);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        showQuote();
    </script>
</body>
</html>
