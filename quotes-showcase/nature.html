<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自然场景 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
            position: relative;
            background: #000;
        }
        .scene-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            transition: opacity 1.5s ease;
        }
        /* 雨夜场景 - 真实的雷雨夜 */
        .scene-rain {
            background: linear-gradient(180deg, #0c1020 0%, #1a2035 30%, #2a3550 70%, #1a2840 100%);
        }
        /* 雪景场景 */
        .scene-snow {
            background: linear-gradient(180deg, #1e2335 0%, #2a3550 40%, #3a4565 100%);
        }
        /* 星空场景 - 更亮的星空 */
        .scene-starry {
            background: linear-gradient(180deg, #080818 0%, #151530 40%, #252545 100%);
        }
        /* 樱花场景 */
        .scene-sakura {
            background: linear-gradient(180deg, #2a1525 0%, #3a2535 40%, #4a3545 100%);
        }
        /* 森林场景 - 更有层次 */
        .scene-forest {
            background: linear-gradient(180deg, #0d1f0d 0%, #1a3a1a 30%, #2a4a2a 60%, #1a3a2a 100%);
        }
        /* 夕阳场景 - 更真实的夕阳 */
        .scene-sunset {
            background: linear-gradient(180deg, #2a1a3a 0%, #5a2a4a 20%, #8a4a3a 50%, #c47a4a 70%, #e8a060 100%);
        }
        /* 海洋场景 - 深海效果 */
        .scene-ocean {
            background: linear-gradient(180deg, #0a1a2a 0%, #0d3a5a 30%, #1a5a7a 60%, #2a7a8a 100%);
        }
        /* 雾气场景 */
        .scene-fog {
            background: linear-gradient(180deg, #2a2a3a 0%, #3a3a4a 40%, #4a4a5a 100%);
        }
        /* 粒子画布 */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        /* 闪电效果 */
        .lightning {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.3);
            z-index: 2;
            opacity: 0;
            pointer-events: none;
        }
        .lightning.flash {
            animation: lightningFlash 0.2s ease-out;
        }
        @keyframes lightningFlash {
            0% { opacity: 0; }
            10% { opacity: 0.8; }
            20% { opacity: 0; }
            30% { opacity: 0.5; }
            100% { opacity: 0; }
        }
        .quote-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 40px;
        }
        .quote-text {
            font-size: clamp(1.4rem, 3vw, 2.4rem);
            line-height: 1.9;
            text-align: center;
            max-width: 85vw;
            color: rgba(255, 255, 255, 0.95);
            padding: 40px 60px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 0.08em;
            font-weight: 300;
        }
        .quote-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        .quote-info {
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.15em;
            opacity: 0;
            transition: opacity 0.8s 0.3s;
        }
        .quote-info.show { opacity: 1; }
        .book-name {
            font-style: italic;
            opacity: 0.7;
        }
        /* 控制按钮 */
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6);
            padding: 12px 32px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            letter-spacing: 0.1em;
            font-family: inherit;
            backdrop-filter: blur(10px);
        }
        .btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            font-size: 0.85rem;
            z-index: 100;
            transition: color 0.3s;
            letter-spacing: 0.1em;
        }
        .back-link:hover { color: rgba(255,255,255,0.7); }
        .settings-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.5);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 100;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .settings-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100vh;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(30px);
            z-index: 1000;
            transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 80px 30px 30px;
            overflow-y: auto;
        }
        .settings-panel.open { right: 0; }
        .settings-panel h3 {
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            margin-bottom: 20px;
            letter-spacing: 0.1em;
        }
        .setting-item {
            margin-bottom: 25px;
        }
        .setting-item label {
            display: block;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }
        .scene-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .scene-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.3s;
            font-family: inherit;
        }
        .scene-btn:hover {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.8);
        }
        .scene-btn.active {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
            color: #fff;
        }
        .setting-item input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
        }
        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            cursor: pointer;
        }
        .close-settings {
            position: absolute;
            top: 30px;
            right: 30px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>
    <div class="scene-bg scene-rain" id="sceneBg"></div>
    <div class="lightning" id="lightning"></div>
    <canvas id="particleCanvas"></canvas>

    <a href="index.html" class="back-link">← 返回</a>
    <button class="settings-btn" onclick="toggleSettings()">⚙</button>

    <div class="overlay" id="overlay" onclick="toggleSettings()"></div>
    <div class="settings-panel" id="settingsPanel">
        <button class="close-settings" onclick="toggleSettings()">×</button>
        <h3>阅读设置</h3>
        <div class="setting-item">
            <label>选择场景</label>
            <div class="scene-options">
                <button class="scene-btn active" onclick="setScene('rain')">雨夜</button>
                <button class="scene-btn" onclick="setScene('snow')">雪景</button>
                <button class="scene-btn" onclick="setScene('starry')">星空</button>
                <button class="scene-btn" onclick="setScene('sakura')">樱花</button>
                <button class="scene-btn" onclick="setScene('forest')">森林</button>
                <button class="scene-btn" onclick="setScene('sunset')">夕阳</button>
                <button class="scene-btn" onclick="setScene('ocean')">海洋</button>
                <button class="scene-btn" onclick="setScene('fog')">雾境</button>
            </div>
        </div>
        <div class="setting-item">
            <label>字号大小</label>
            <input type="range" min="12" max="32" value="20" id="fontSizeSlider" onchange="updateFontSize()">
        </div>
        <div class="setting-item">
            <label>粒子密度</label>
            <input type="range" min="50" max="500" value="200" id="densitySlider" onchange="updateDensity()">
        </div>
    </div>

    <div class="quote-container">
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-info" id="quoteInfo"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "雨声潺潺，像住在溪边，宁愿天天下雨，以为你是因为下雨不来。", author: "张爱玲", book: "小团圆" },
            { text: "雪落无声，覆盖了整个世界，也覆盖了所有的悲伤。", author: "川端康成", book: "雪国" },
            { text: "星星之所以美丽，是因为某一颗上面有一朵看不见的花。", author: "圣埃克苏佩里", book: "小王子" },
            { text: "樱花飘落的速度，是每秒五厘米。", author: "新海诚", book: "秒速五厘米" },
            { text: "森林里分出两条路，我选择了人迹更少的一条。", author: "弗罗斯特", book: "未选择的路" },
            { text: "夕阳无限好，只是近黄昏。", author: "李商隐", book: "乐游原" },
            { text: "海内存知己，天涯若比邻。", author: "王勃", book: "送杜少府之任蜀州" },
            { text: "雾失楼台，月迷津渡。", author: "秦观", book: "踏莎行" }
        ];

        const scenes = {
            rain: { class: 'scene-rain', particleType: 'rain', color: 'rgba(180,200,255,0.4)', hasLightning: true },
            snow: { class: 'scene-snow', particleType: 'snow', color: 'rgba(255,255,255,0.9)', hasLightning: false },
            starry: { class: 'scene-starry', particleType: 'star', color: 'rgba(255,255,220,0.9)', hasLightning: false },
            sakura: { class: 'scene-sakura', particleType: 'petal', color: 'rgba(255,200,220,0.7)', hasLightning: false },
            forest: { class: 'scene-forest', particleType: 'firefly', color: 'rgba(200,255,100,0.6)', hasLightning: false },
            sunset: { class: 'scene-sunset', particleType: 'ember', color: 'rgba(255,180,80,0.6)', hasLightning: false },
            ocean: { class: 'scene-ocean', particleType: 'bubble', color: 'rgba(200,230,255,0.4)', hasLightning: false },
            fog: { class: 'scene-fog', particleType: 'mist', color: 'rgba(255,255,255,0.15)', hasLightning: false }
        };

        let currentIndex = 0;
        let currentScene = 'rain';
        let particles = [];
        let particleCount = 200;
        let animationId;
        let lightningTimer;

        function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            particles = [];
            const scene = scenes[currentScene];

            for (let i = 0; i < particleCount; i++) {
                particles.push(createParticle(scene.particleType, canvas.width, canvas.height));
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    updateParticle(p, scene.particleType);
                    drawParticle(ctx, p, scene);
                });

                animationId = requestAnimationFrame(animate);
            }

            if (animationId) cancelAnimationFrame(animationId);
            animate();

            // 闪电效果
            if (scene.hasLightning) {
                startLightning();
            } else {
                stopLightning();
            }
        }

        function createParticle(type, w, h) {
            const p = {
                x: Math.random() * w,
                y: Math.random() * h,
                size: Math.random() * 3 + 1,
                speedX: 0,
                speedY: 0,
                opacity: Math.random() * 0.5 + 0.2,
                life: Math.random() * 100
            };

            switch(type) {
                case 'rain':
                    p.speedY = Math.random() * 15 + 10;
                    p.speedX = Math.random() * 2 - 1;
                    p.size = Math.random() * 2 + 1;
                    break;
                case 'snow':
                    p.speedY = Math.random() * 2 + 0.5;
                    p.speedX = Math.random() * 2 - 1;
                    p.size = Math.random() * 4 + 2;
                    break;
                case 'star':
                    p.size = Math.random() * 2 + 0.5;
                    p.opacity = Math.random();
                    p.speedY = 0;
                    p.speedX = 0;
                    break;
                case 'petal':
                    p.speedY = Math.random() * 2 + 0.5;
                    p.speedX = Math.random() * 3 - 1.5;
                    p.size = Math.random() * 6 + 3;
                    p.rotation = Math.random() * Math.PI * 2;
                    p.rotationSpeed = Math.random() * 0.02 - 0.01;
                    break;
                case 'firefly':
                    p.speedX = Math.random() * 2 - 1;
                    p.speedY = Math.random() * 2 - 1;
                    p.size = Math.random() * 3 + 1;
                    p.opacity = Math.random();
                    break;
                case 'ember':
                    p.speedY = -(Math.random() * 2 + 0.5);
                    p.speedX = Math.random() * 2 - 1;
                    p.size = Math.random() * 3 + 1;
                    break;
                case 'bubble':
                    p.speedY = -(Math.random() * 1 + 0.3);
                    p.speedX = Math.random() * 1 - 0.5;
                    p.size = Math.random() * 5 + 2;
                    break;
                case 'mist':
                    p.speedX = Math.random() * 0.5 + 0.2;
                    p.speedY = 0;
                    p.size = Math.random() * 100 + 50;
                    p.opacity = Math.random() * 0.1 + 0.05;
                    break;
            }

            return p;
        }

        function updateParticle(p, type) {
            p.x += p.speedX;
            p.y += p.speedY;
            p.life++;

            if (type === 'petal') {
                p.rotation += p.rotationSpeed;
            }

            if (type === 'firefly' || type === 'star') {
                p.opacity = 0.3 + Math.sin(p.life * 0.05) * 0.3;
            }

            const canvas = document.getElementById('particleCanvas');
            if (p.y > canvas.height + 50 || p.y < -50 ||
                p.x > canvas.width + 50 || p.x < -50) {
                if (type === 'mist') {
                    p.x = -p.size;
                    p.y = Math.random() * canvas.height;
                } else if (type === 'ember' || type === 'bubble') {
                    p.x = Math.random() * canvas.width;
                    p.y = canvas.height + 50;
                } else {
                    p.x = Math.random() * canvas.width;
                    p.y = -50;
                }
            }
        }

        function drawParticle(ctx, p, scene) {
            ctx.save();
            ctx.globalAlpha = p.opacity;

            if (scene.particleType === 'petal') {
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = scene.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (scene.particleType === 'bubble') {
                ctx.strokeStyle = scene.color;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = scene.color;
                ctx.globalAlpha = p.opacity * 0.3;
                ctx.fill();
            } else if (scene.particleType === 'mist') {
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                gradient.addColorStop(0, scene.color);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = scene.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function startLightning() {
            stopLightning();
            lightningTimer = setInterval(() => {
                if (Math.random() < 0.3) {
                    const lightning = document.getElementById('lightning');
                    lightning.classList.add('flash');
                    setTimeout(() => lightning.classList.remove('flash'), 200);
                }
            }, 3000);
        }

        function stopLightning() {
            if (lightningTimer) {
                clearInterval(lightningTimer);
                lightningTimer = null;
            }
        }

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');

            setTimeout(() => {
                textEl.textContent = quote.text;
                infoEl.innerHTML = `${quote.author} · <span class="book-name">${quote.book}</span>`;
                textEl.classList.add('show');
                infoEl.classList.add('show');
            }, 300);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        function setScene(sceneName) {
            currentScene = sceneName;
            const bg = document.getElementById('sceneBg');
            const scene = scenes[sceneName];

            bg.className = 'scene-bg ' + scene.class;

            document.querySelectorAll('.scene-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            initParticles();
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function updateFontSize() {
            const size = document.getElementById('fontSizeSlider').value;
            document.getElementById('quoteText').style.fontSize = size + 'px';
        }

        function updateDensity() {
            particleCount = parseInt(document.getElementById('densitySlider').value);
            initParticles();
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('particleCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        showQuote();
        initParticles();
    </script>
</body>
</html>
