<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分形生长效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', 'Georgia', serif;
            overflow: hidden;
            position: relative;
        }
        #fractalCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        .container {
            text-align: center;
            padding: 40px 60px;
            max-width: 90vw;
            width: 100%;
            position: relative;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .quote-text {
            font-size: clamp(1.5rem, 3vw, 2.4rem);
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 0.08em;
            font-weight: 300;
            opacity: 0;
            transform: translateY(25px);
            transition: all 1.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .quote-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        .quote-text .char {
            display: inline-block;
            opacity: 0;
            animation: charFade 0.5s ease forwards;
        }
        @keyframes charFade {
            to { opacity: 1; }
        }
        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100, 200, 255, 0.4), transparent);
            margin: 35px auto 20px;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
        }
        .divider.show {
            opacity: 1;
        }
        .quote-info {
            font-size: 0.85rem;
            color: rgba(150, 200, 255, 0.5);
            letter-spacing: 0.25em;
            opacity: 0;
            transition: opacity 1.5s ease 0.8s;
            font-weight: 300;
        }
        .quote-info.show {
            opacity: 1;
        }
        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            font-size: 0.75rem;
            z-index: 100;
            transition: all 0.6s;
            letter-spacing: 0.15em;
            font-weight: 300;
        }
        .back-link:hover { color: rgba(100, 200, 255, 0.7); }
        .controls {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: transparent;
            border: 1px solid rgba(100, 200, 255, 0.15);
            color: rgba(150, 200, 255, 0.4);
            padding: 12px 32px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 0.15em;
            font-family: inherit;
            font-weight: 300;
        }
        .btn:hover {
            border-color: rgba(100, 200, 255, 0.4);
            color: rgba(150, 200, 255, 0.8);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.1);
        }
    </style>
</head>
<body>
    <canvas id="fractalCanvas"></canvas>
    <a href="index.html" class="back-link">&larr; 返回</a>

    <div class="container">
        <div class="quote-text" id="quoteText"></div>
        <div class="divider" id="divider"></div>
        <div class="quote-info" id="quoteInfo">
            <span id="author"></span> &middot; <span id="book"></span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "简单是终极的复杂", author: "达芬奇", book: "笔记" },
            { text: "数学是上帝书写宇宙的文字", author: "伽利略", book: "试金者" },
            { text: "在混沌中寻找秩序，在无序中发现美", author: "曼德勃罗", book: "大自然的分形几何学" },
            { text: "一片雪花，就是一个微型的宇宙", author: "开普勒", book: "六角雪花" },
            { text: "无限的可能，藏在有限的规则之中", author: "埃舍尔", book: "版画集" },
            { text: "美是真理的光辉，真理是美的内核", author: "济慈", book: "希腊古瓮颂" }
        ];

        let currentIndex = 0;
        let canvas, ctx;
        let width, height;
        let branches = [];
        let animId;

        function init() {
            canvas = document.getElementById('fractalCanvas');
            ctx = canvas.getContext('2d');
            resize();
            window.addEventListener('resize', resize);
            startFractalGrowth();
            showQuote();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Branch {
            constructor(x, y, angle, length, depth, maxDepth) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.length = length;
                this.depth = depth;
                this.maxDepth = maxDepth;
                this.growth = 0;
                this.speed = 0.02 + Math.random() * 0.03;
                this.children = [];
                this.hue = 200 + (depth / maxDepth) * 60;
                this.width = Math.max(0.5, 3 - (depth / maxDepth) * 2.5);
                this.finished = false;
            }

            grow() {
                if (this.growth < 1) {
                    this.growth += this.speed;
                    if (this.growth > 1) this.growth = 1;
                } else if (!this.finished && this.depth < this.maxDepth) {
                    this.finished = true;
                    const numBranches = 2 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < numBranches; i++) {
                        const angleOffset = (Math.random() - 0.5) * 1.2;
                        const newAngle = this.angle + angleOffset;
                        const newLength = this.length * (0.6 + Math.random() * 0.2);
                        const endX = this.x + Math.cos(this.angle) * this.length;
                        const endY = this.y + Math.sin(this.angle) * this.length;
                        this.children.push(new Branch(
                            endX, endY, newAngle, newLength,
                            this.depth + 1, this.maxDepth
                        ));
                    }
                }

                this.children.forEach(child => child.grow());
            }

            draw(ctx) {
                const endX = this.x + Math.cos(this.angle) * this.length * this.growth;
                const endY = this.y + Math.sin(this.angle) * this.length * this.growth;

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = `hsla(${this.hue}, 60%, ${30 + this.depth * 8}%, ${0.6 - this.depth * 0.1})`;
                ctx.lineWidth = this.width;
                ctx.lineCap = 'round';
                ctx.stroke();

                // 发光效果
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = `hsla(${this.hue}, 80%, 50%, 0.1)`;
                ctx.lineWidth = this.width * 3;
                ctx.stroke();

                this.children.forEach(child => child.draw(ctx));
            }
        }

        function startFractalGrowth() {
            branches = [];
            const numTrees = 3;
            for (let i = 0; i < numTrees; i++) {
                const x = width * (0.2 + i * 0.3);
                const y = height * 0.85;
                branches.push(new Branch(x, y, -Math.PI / 2, height * 0.15, 0, 8));
            }
            animate();
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);

            branches.forEach(branch => {
                branch.grow();
                branch.draw(ctx);
            });

            animId = requestAnimationFrame(animate);
        }

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            const dividerEl = document.getElementById('divider');

            textEl.classList.remove('show');
            infoEl.classList.remove('show');
            dividerEl.classList.remove('show');

            setTimeout(() => {
                textEl.innerHTML = '';
                const chars = quote.text.split('');
                chars.forEach((char, i) => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    span.style.animationDelay = (i * 0.04) + 's';
                    textEl.appendChild(span);
                });

                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;

                textEl.classList.add('show');
                setTimeout(() => {
                    dividerEl.classList.add('show');
                    infoEl.classList.add('show');
                }, 400);
            }, 400);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
            // 重新开始分形生长
            startFractalGrowth();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
            startFractalGrowth();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        init();
    </script>
</body>
</html>
