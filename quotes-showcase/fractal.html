<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分形生长效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f0a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 900px;
            position: relative;
            z-index: 10;
        }
        .quote-text {
            font-size: 2.5rem;
            line-height: 1.8;
            color: #90EE90;
            text-shadow: 0 0 20px rgba(144, 238, 144, 0.5);
        }
        .quote-text .char {
            display: inline-block;
            opacity: 0;
            animation: grow 0.8s ease forwards;
        }
        @keyframes grow {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-180deg);
                color: #228B22;
            }
            50% {
                opacity: 0.7;
                transform: scale(1.2) rotate(10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
                color: #90EE90;
            }
        }
        .quote-info {
            margin-top: 40px;
            font-size: 1.2rem;
            color: #8FBC8F;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .quote-info.show {
            opacity: 1;
        }
        .vine {
            position: fixed;
            width: 2px;
            background: linear-gradient(to top, #228B22, #90EE90);
            transform-origin: bottom center;
            animation: vineGrow 2s ease forwards;
            pointer-events: none;
        }
        @keyframes vineGrow {
            0% { height: 0; opacity: 0; }
            100% { height: 200px; opacity: 0.6; }
        }
        .leaf {
            position: fixed;
            width: 20px;
            height: 20px;
            background: #90EE90;
            border-radius: 0 100% 0 100%;
            opacity: 0;
            animation: leafAppear 0.5s ease forwards;
            pointer-events: none;
        }
        @keyframes leafAppear {
            0% { opacity: 0; transform: scale(0) rotate(-90deg); }
            100% { opacity: 0.8; transform: scale(1) rotate(0); }
        }
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(144, 238, 144, 0.5);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .back-link:hover { color: #90EE90; }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        .btn {
            background: rgba(34, 139, 34, 0.2);
            border: 1px solid rgba(144, 238, 144, 0.3);
            color: #90EE90;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .btn:hover {
            background: rgba(34, 139, 34, 0.3);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← 返回目录</a>
    
    <div class="container">
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-info" id="quoteInfo">
            <span id="author"></span> · <span id="book"></span>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="prevQuote()">上一个</button>
        <button class="btn" onclick="nextQuote()">下一个</button>
    </div>

    <script>
        const quotes = [
            { text: "种一棵树最好的时间是十年前，其次是现在", author: "丹比萨·莫约", book: "死去的援助" },
            { text: "生命不是要等待暴风雨过去，而是要学会在雨中跳舞", author: "维维安·格林", book: "生活哲学" },
            { text: "万物生长，各自高贵", author: "庄子", book: "逍遥游" },
            { text: "苔花如米小，也学牡丹开", author: "袁枚", book: "苔" },
            { text: "野火烧不尽，春风吹又生", author: "白居易", book: "赋得古原草送别" },
            { text: "落红不是无情物，化作春泥更护花", author: "龚自珍", book: "己亥杂诗" }
        ];

        let currentIndex = 0;

        function createVines() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const vine = document.createElement('div');
                    vine.className = 'vine';
                    vine.style.left = (Math.random() * window.innerWidth) + 'px';
                    vine.style.bottom = '0';
                    vine.style.animationDelay = (Math.random() * 0.5) + 's';
                    document.body.appendChild(vine);
                    
                    // 添加叶子
                    setTimeout(() => {
                        const leaf = document.createElement('div');
                        leaf.className = 'leaf';
                        leaf.style.left = vine.style.left;
                        leaf.style.bottom = (150 + Math.random() * 50) + 'px';
                        leaf.style.transform = `rotate(${Math.random() * 360}deg)`;
                        document.body.appendChild(leaf);
                        
                        setTimeout(() => {
                            vine.remove();
                            leaf.remove();
                        }, 4000);
                    }, 1500);
                }, i * 200);
            }
        }

        function showQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('quoteText');
            const infoEl = document.getElementById('quoteInfo');
            
            textEl.innerHTML = '';
            infoEl.classList.remove('show');
            
            createVines();
            
            const chars = quote.text.split('');
            chars.forEach((char, i) => {
                const span = document.createElement('span');
                span.className = 'char';
                span.textContent = char === ' ' ? '\u00A0' : char;
                span.style.animationDelay = (i * 0.15) + 's';
                textEl.appendChild(span);
            });
            
            setTimeout(() => {
                document.getElementById('author').textContent = quote.author;
                document.getElementById('book').textContent = quote.book;
                infoEl.classList.add('show');
            }, chars.length * 150 + 500);
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            showQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        showQuote();
    </script>
</body>
</html>
