<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻书页效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', 'Georgia', serif;
            overflow: hidden;
            perspective: 2000px;
        }
        .scene {
            width: 90vw;
            max-width: 1000px;
            height: 75vh;
            max-height: 700px;
            position: relative;
            transform-style: preserve-3d;
            z-index: 10;
        }
        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .page {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            background: linear-gradient(to right, #f5f0e8 0%, #f0ebe0 100%);
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            backface-visibility: hidden;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: inset -5px 0 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        .page.right {
            left: 50%;
            transform-origin: left center;
            background: linear-gradient(to left, #f5f0e8 0%, #f0ebe0 100%);
            box-shadow: inset 5px 0 15px rgba(0,0,0,0.1);
        }
        .page.flipped {
            transform: rotateY(-180deg);
        }
        .page-back {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: linear-gradient(to left, #f0ebe0 0%, #e8e3d8 100%);
            transform: rotateY(180deg);
            backface-visibility: hidden;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: inset 5px 0 15px rgba(0,0,0,0.1);
        }
        .quote-text {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            line-height: 1.9;
            color: #2a2520;
            margin-bottom: 25px;
            letter-spacing: 0.05em;
            font-weight: 400;
        }
        .quote-info {
            font-size: clamp(0.75rem, 1.3vw, 0.9rem);
            color: #8a8078;
            text-align: right;
            letter-spacing: 0.1em;
        }
        .controls {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6);
            padding: 12px 32px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.5s ease;
            letter-spacing: 0.1em;
            font-family: inherit;
        }
        .btn:hover {
            border-color: rgba(255,255,255,0.4);
            color: rgba(255,255,255,0.9);
            background: rgba(255,255,255,0.05);
        }
        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.8rem;
            z-index: 100;
            transition: color 0.5s;
            letter-spacing: 0.1em;
        }
        .back-link:hover { color: rgba(255,255,255,0.8); }
        .page-num {
            position: absolute;
            bottom: 20px;
            font-size: 0.7rem;
            color: #aaa;
        }
        .page-num.left { left: 30px; }
        .page-num.right { right: 30px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">&larr; 返回</a>

    <div class="scene">
        <div class="book" id="book">
            <div class="page" id="leftPage">
                <div class="quote-text" id="leftText"></div>
                <div class="quote-info">
                    <span id="leftAuthor"></span> &middot; <span id="leftBook"></span>
                </div>
                <div class="page-num left" id="leftNum"></div>
            </div>
            <div class="page right" id="rightPage">
                <div class="quote-text" id="rightText"></div>
                <div class="quote-info">
                    <span id="rightAuthor"></span> &middot; <span id="rightBook"></span>
                </div>
                <div class="page-num right" id="rightNum"></div>
                <div class="page-back">
                    <div class="quote-text" id="backText"></div>
                    <div class="quote-info">
                        <span id="backAuthor"></span> &middot; <span id="backBook"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevPage()">上一页</button>
        <button class="btn" onclick="flipPage()">翻页</button>
        <button class="btn" onclick="nextPage()">下一页</button>
    </div>

    <script>
        const quotes = [
            { text: "人是一根有思想的芦苇", author: "帕斯卡", book: "思想录" },
            { text: "我思故我在", author: "笛卡尔", book: "第一哲学沉思集" },
            { text: "未经审视的人生不值得过", author: "苏格拉底", book: "申辩篇" },
            { text: "世界上只有一种真正的英雄主义", author: "罗曼·罗兰", book: "米开朗基罗传" },
            { text: "人生而自由，却无往不在枷锁之中", author: "卢梭", book: "社会契约论" },
            { text: "存在即合理", author: "黑格尔", book: "法哲学原理" },
            { text: "知识就是力量", author: "培根", book: "新工具" },
            { text: "我唯一知道的就是我一无所知", author: "苏格拉底", book: "申辩篇" }
        ];

        let currentPage = 0;
        let isFlipped = false;

        function showPages() {
            const leftIdx = currentPage * 2;
            const rightIdx = leftIdx + 1;

            const leftQuote = quotes[leftIdx] || { text: "", author: "", book: "" };
            const rightQuote = quotes[rightIdx] || { text: "", author: "", book: "" };

            document.getElementById('leftText').textContent = leftQuote.text;
            document.getElementById('leftAuthor').textContent = leftQuote.author;
            document.getElementById('leftBook').textContent = leftQuote.book;
            document.getElementById('leftNum').textContent = leftIdx + 1;

            document.getElementById('rightText').textContent = rightQuote.text;
            document.getElementById('rightAuthor').textContent = rightQuote.author;
            document.getElementById('rightBook').textContent = rightQuote.book;
            document.getElementById('rightNum').textContent = rightIdx + 1;

            // 预加载背面内容（下一页）
            const nextLeftIdx = (currentPage + 1) * 2;
            const nextLeftQuote = quotes[nextLeftIdx] || { text: "", author: "", book: "" };
            document.getElementById('backText').textContent = nextLeftQuote.text;
            document.getElementById('backAuthor').textContent = nextLeftQuote.author;
            document.getElementById('backBook').textContent = nextLeftQuote.book;
        }

        function flipPage() {
            const rightPage = document.getElementById('rightPage');
            if (!isFlipped) {
                rightPage.classList.add('flipped');
                isFlipped = true;
            } else {
                currentPage++;
                if (currentPage * 2 >= quotes.length) currentPage = 0;
                showPages();
                rightPage.classList.remove('flipped');
                isFlipped = false;
            }
        }

        function nextPage() {
            if (isFlipped) {
                currentPage++;
                if (currentPage * 2 >= quotes.length) currentPage = 0;
                showPages();
                document.getElementById('rightPage').classList.remove('flipped');
                isFlipped = false;
            } else {
                flipPage();
            }
        }

        function prevPage() {
            currentPage--;
            if (currentPage < 0) currentPage = Math.floor((quotes.length - 1) / 2);
            showPages();
            document.getElementById('rightPage').classList.remove('flipped');
            isFlipped = false;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
            if (e.key === ' ') {
                e.preventDefault();
                flipPage();
            }
        });

        showPages();
    </script>
</body>
</html>
