<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻书页效果 - 书摘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', 'Georgia', serif;
            overflow: hidden;
            perspective: 2000px;
        }
        /* 背景装饰 */
        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 50%, rgba(120, 80, 60, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 50%, rgba(60, 80, 120, 0.06) 0%, transparent 50%),
                #0a0a12;
            z-index: 0;
        }
        .scene {
            width: 500px;
            height: 350px;
            position: relative;
            transform-style: preserve-3d;
            z-index: 10;
        }
        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #e8e0d0 0%, #f5f0e8 5%, #f5f0e8 95%, #e0d8c8 100%);
            border-radius: 3px 12px 12px 3px;
            box-shadow:
                0 0 30px rgba(0,0,0,0.4),
                inset -3px 0 10px rgba(0,0,0,0.05);
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            backface-visibility: hidden;
            transform-origin: left center;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        .page.flipped {
            transform: rotateY(-180deg);
        }
        .page-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to left, #e8e0d0 0%, #f5f0e8 5%, #f5f0e8 95%, #e0d8c8 100%);
            border-radius: 12px 3px 3px 12px;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            backface-visibility: hidden;
            transform: rotateY(180deg);
            transform-origin: left center;
            box-shadow:
                0 0 30px rgba(0,0,0,0.4),
                inset 3px 0 10px rgba(0,0,0,0.05);
        }
        /* 纸张纹理 */
        .page::before,
        .page-back::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
            pointer-events: none;
            border-radius: inherit;
        }
        .quote-text {
            font-size: 1.6rem;
            line-height: 1.9;
            color: #2a2520;
            margin-bottom: 25px;
            letter-spacing: 0.05em;
            font-weight: 400;
        }
        .quote-info {
            font-size: 0.85rem;
            color: #8a8078;
            text-align: right;
            letter-spacing: 0.1em;
        }
        .page-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.15) 0%, transparent 15%);
            pointer-events: none;
            border-radius: 3px 12px 12px 3px;
        }
        .controls {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4);
            padding: 12px 32px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 0.15em;
            font-family: inherit;
            font-weight: 300;
        }
        .btn:hover {
            border-color: rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.8);
        }
        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: rgba(255,255,255,0.2);
            text-decoration: none;
            font-size: 0.75rem;
            z-index: 100;
            transition: all 0.6s;
            letter-spacing: 0.15em;
            font-weight: 300;
        }
        .back-link:hover { color: rgba(255,255,255,0.6); }
        /* 书脊装饰 */
        .spine {
            position: absolute;
            left: -8px;
            top: 10px;
            bottom: 10px;
            width: 16px;
            background: linear-gradient(to right, #3a3028, #5a5048, #3a3028);
            border-radius: 3px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <a href="index.html" class="back-link">&larr; 返回</a>

    <div class="scene">
        <div class="spine"></div>
        <div class="book" id="book">
            <div class="page" id="page">
                <div class="quote-text" id="quoteText"></div>
                <div class="quote-info">
                    <span id="author"></span> &middot; <span id="bookName"></span>
                </div>
                <div class="page-shadow"></div>
                <div class="page-back">
                    <div class="quote-text" id="backText"></div>
                    <div class="quote-info">
                        <span id="backAuthor"></span> &middot; <span id="backBook"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevPage()">上一页</button>
        <button class="btn" onclick="flipPage()">翻页</button>
        <button class="btn" onclick="nextPage()">下一页</button>
    </div>

    <script>
        const quotes = [
            { text: "人是一根有思想的芦苇", author: "帕斯卡", book: "思想录" },
            { text: "我思故我在", author: "笛卡尔", book: "第一哲学沉思集" },
            { text: "未经审视的人生不值得过", author: "苏格拉底", book: "申辩篇" },
            { text: "世界上只有一种真正的英雄主义", author: "罗曼·罗兰", book: "米开朗基罗传" },
            { text: "人生而自由，却无往不在枷锁之中", author: "卢梭", book: "社会契约论" },
            { text: "存在即合理", author: "黑格尔", book: "法哲学原理" }
        ];

        let currentIndex = 0;
        let isFlipped = false;

        function showQuote() {
            const quote = quotes[currentIndex];
            document.getElementById('quoteText').textContent = quote.text;
            document.getElementById('author').textContent = quote.author;
            document.getElementById('bookName').textContent = quote.book;
        }

        function showBackQuote() {
            const nextIndex = (currentIndex + 1) % quotes.length;
            const quote = quotes[nextIndex];
            document.getElementById('backText').textContent = quote.text;
            document.getElementById('backAuthor').textContent = quote.author;
            document.getElementById('backBook').textContent = quote.book;
        }

        function flipPage() {
            const page = document.getElementById('page');
            if (!isFlipped) {
                showBackQuote();
                page.classList.add('flipped');
                isFlipped = true;
            } else {
                currentIndex = (currentIndex + 1) % quotes.length;
                showQuote();
                page.classList.remove('flipped');
                isFlipped = false;
            }
        }

        function nextPage() {
            if (isFlipped) {
                currentIndex = (currentIndex + 1) % quotes.length;
                showQuote();
                document.getElementById('page').classList.remove('flipped');
                isFlipped = false;
            } else {
                flipPage();
            }
        }

        function prevPage() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            showQuote();
            document.getElementById('page').classList.remove('flipped');
            isFlipped = false;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
            if (e.key === ' ') {
                e.preventDefault();
                flipPage();
            }
        });

        showQuote();
    </script>
</body>
</html>
