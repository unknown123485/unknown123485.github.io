<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>黑曜石核心 · 书摘终端</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050505;
            --bg-panel: #0a0a0a;
            --gold: #ffb700;
            --gold-bright: #ffd700;
            --gold-dim: rgba(255, 183, 0, 0.3);
            --cyan: #00d4ff;
            --cyan-glow: rgba(0, 212, 255, 0.4);
            --red: #ff3366;
            --text: rgba(255, 255, 255, 0.9);
            --text-dim: rgba(255, 255, 255, 0.4);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans SC', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 扫描线效果 */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
        }

        /* 顶部大标题区 - 占20%高度 */
        .hero-section {
            height: 20vh;
            min-height: 140px;
            background: linear-gradient(180deg, rgba(255,183,0,0.08) 0%, transparent 100%);
            border-bottom: 1px solid rgba(255,183,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 40px;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            animation: scanH 3s linear infinite;
        }

        @keyframes scanH {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .hero-label {
            font-size: 11px;
            color: var(--gold);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hero-label::before {
            content: '';
            width: 30px;
            height: 1px;
            background: var(--gold);
        }

        .hero-title {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 700;
            line-height: 1.4;
            color: var(--text);
            text-shadow: 0 0 30px rgba(255,183,0,0.15);
            transition: all 0.5s ease;
        }

        .hero-title.switching {
            animation: glitchText 0.4s ease;
        }

        @keyframes glitchText {
            0% { transform: translateX(0); filter: hue-rotate(0deg); }
            20% { transform: translateX(-5px); filter: hue-rotate(90deg); }
            40% { transform: translateX(5px); filter: hue-rotate(180deg); }
            60% { transform: translateX(-3px); filter: hue-rotate(270deg); }
            80% { transform: translateX(3px); filter: hue-rotate(360deg); }
            100% { transform: translateX(0); filter: hue-rotate(0deg); }
        }

        .hero-meta {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            gap: 20px;
        }

        .hero-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hero-meta .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--gold); }
            50% { opacity: 0.4; box-shadow: 0 0 2px var(--gold); }
        }

        /* 主内容区 */
        .main-area {
            flex: 1;
            display: flex;
            padding: 20px 40px;
            gap: 20px;
            overflow: hidden;
        }

        /* 左侧关键词面板 */
        .keywords-panel {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-label {
            font-size: 10px;
            color: var(--gold-dim);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,183,0,0.15);
        }

        .keyword-tag {
            padding: 10px 14px;
            background: rgba(255,183,0,0.05);
            border: 1px solid rgba(255,183,0,0.15);
            border-radius: 6px;
            font-size: 13px;
            color: var(--gold);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .keyword-tag::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,183,0,0.2), transparent);
            transition: left 0.5s;
        }

        .keyword-tag:hover::before {
            left: 100%;
        }

        .keyword-tag:hover {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(255,183,0,0.2);
            transform: translateX(5px);
        }

        .keyword-tag .kw-score {
            float: right;
            font-size: 10px;
            color: var(--text-dim);
        }

        /* 中间书摘区 */
        .quote-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 40px;
            position: relative;
        }

        .quote-content {
            text-align: center;
            max-width: 700px;
            position: relative;
        }

        .quote-text {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            line-height: 2;
            color: var(--text);
            font-weight: 300;
            letter-spacing: 0.05em;
            transition: all 0.5s ease;
        }

        .quote-text .highlight-word {
            color: var(--gold);
            font-weight: 500;
            text-shadow: 0 0 10px rgba(255,183,0,0.3);
        }

        .quote-author {
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 0.15em;
        }

        .quote-author::before,
        .quote-author::after {
            content: '—';
            margin: 0 10px;
            color: var(--gold-dim);
        }

        /* 切换动画 */
        .quote-content.switching-out {
            animation: cyberOut 0.3s ease forwards;
        }

        .quote-content.switching-in {
            animation: cyberIn 0.4s ease forwards;
        }

        @keyframes cyberOut {
            0% { opacity: 1; transform: scale(1); filter: blur(0); }
            50% { opacity: 0.5; transform: scale(0.95); filter: blur(2px); }
            100% { opacity: 0; transform: scale(0.9); filter: blur(8px); }
        }

        @keyframes cyberIn {
            0% { opacity: 0; transform: scale(1.1); filter: blur(8px) brightness(2); }
            50% { opacity: 0.7; transform: scale(1.02); filter: blur(2px) brightness(1.5); }
            100% { opacity: 1; transform: scale(1); filter: blur(0) brightness(1); }
        }

        /* 右侧信息面板 */
        .info-panel {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stat-box {
            padding: 16px;
            background: rgba(255,183,0,0.03);
            border: 1px solid rgba(255,183,0,0.1);
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 0 15px rgba(255,183,0,0.3);
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 4px;
            letter-spacing: 0.1em;
        }

        /* 底部导航栏 */
        .nav-bar {
            height: 80px;
            background: linear-gradient(0deg, rgba(255,183,0,0.05) 0%, transparent 100%);
            border-top: 1px solid rgba(255,183,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 0 40px;
            position: relative;
        }

        .nav-bar::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            animation: scanH 3s linear infinite;
        }

        /* 赛博朋克按钮 */
        .cyber-btn {
            position: relative;
            padding: 14px 32px;
            background: transparent;
            border: 1px solid rgba(255,183,0,0.3);
            color: var(--text-dim);
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 0.15em;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s;
            min-width: 140px;
            text-align: center;
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,183,0,0.3), transparent);
            transition: left 0.4s;
        }

        .cyber-btn:hover::before {
            left: 100%;
        }

        .cyber-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 
                0 0 20px rgba(255,183,0,0.2),
                inset 0 0 20px rgba(255,183,0,0.05);
            text-shadow: 0 0 10px rgba(255,183,0,0.5);
        }

        .cyber-btn:active {
            transform: scale(0.97);
        }

        /* 闪烁效果 */
        .cyber-btn.flicker {
            animation: btnFlicker 0.15s ease 3;
        }

        @keyframes btnFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 当前按钮特殊样式 */
        .cyber-btn.current {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(255,183,0,0.08);
            box-shadow: 
                0 0 30px rgba(255,183,0,0.15),
                inset 0 0 30px rgba(255,183,0,0.05);
            animation: currentPulse 2s ease-in-out infinite;
        }

        @keyframes currentPulse {
            0%, 100% { 
                box-shadow: 
                    0 0 30px rgba(255,183,0,0.15),
                    inset 0 0 30px rgba(255,183,0,0.05);
            }
            50% { 
                box-shadow: 
                    0 0 50px rgba(255,183,0,0.25),
                    inset 0 0 40px rgba(255,183,0,0.08);
            }
        }

        .cyber-btn.current::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 1px solid var(--gold);
            opacity: 0;
            animation: borderExpand 2s ease-out infinite;
        }

        @keyframes borderExpand {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); }
        }

        /* 导航指示器 */
        .nav-indicator {
            position: absolute;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .nav-indicator .page-num {
            color: var(--gold);
            font-weight: 600;
            font-size: 14px;
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background: rgba(255,183,0,0.08);
            border: 1px solid rgba(255,183,0,0.2);
            color: var(--gold-dim);
            font-size: 11px;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 100;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255,183,0,0.15);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 20px rgba(255,183,0,0.2);
        }

        /* 粒子背景 */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.3;
            animation: floatParticle 8s ease-in-out infinite;
        }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            50% { transform: translateY(-100px) translateX(50px); opacity: 0.6; }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .hero-section { padding: 0 20px; min-height: 100px; }
            .main-area { padding: 10px 20px; flex-direction: column; }
            .keywords-panel, .info-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
            .quote-area { padding: 0; }
            .nav-bar { gap: 10px; padding: 0 20px; }
            .cyber-btn { min-width: 100px; padding: 10px 20px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="particles" id="particles"></div>

    <a href="../index.html" class="back-btn">← 返回</a>

    <!-- 顶部大标题区 -->
    <div class="hero-section">
        <div class="hero-label">
            <span>当前书摘</span>
            <span style="color: var(--text-dim); font-size: 10px;">CURRENT QUOTE</span>
        </div>
        <div class="hero-title" id="heroTitle">在广袤的空间和无限的时间中...</div>
        <div class="hero-meta">
            <span><div class="dot"></div>实时分析中</span>
            <span id="heroAuthor">卡尔·萨根 · 宇宙</span>
            <span id="quoteIndex">1 / 8</span>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-area">
        <!-- 左侧关键词 -->
        <div class="keywords-panel">
            <div class="panel-label">关键词提取</div>
            <div id="keywordsList">
                <div class="keyword-tag">空间 <span class="kw-score">95%</span></div>
                <div class="keyword-tag">时间 <span class="kw-score">88%</span></div>
                <div class="keyword-tag">宇宙 <span class="kw-score">82%</span></div>
                <div class="keyword-tag">荣幸 <span class="kw-score">76%</span></div>
            </div>
        </div>

        <!-- 中间书摘 -->
        <div class="quote-area">
            <div class="quote-content" id="quoteContent">
                <div class="quote-text" id="quoteText">
                    在广袤的空间和无限的时间中，能与你共享同一颗行星和同一段时光，是我莫大的荣幸。
                </div>
                <div class="quote-author" id="quoteAuthor">卡尔 · 萨根</div>
            </div>
        </div>

        <!-- 右侧统计 -->
        <div class="info-panel">
            <div class="panel-label">阅读数据</div>
            <div class="stat-box">
                <div class="stat-value" id="charCount">42</div>
                <div class="stat-label">字符数</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="wordCount">28</div>
                <div class="stat-label">词数</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="readTime">15s</div>
                <div class="stat-label">阅读时间</div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="nav-bar">
        <button class="cyber-btn" id="btnPrev" onclick="prevQuote()">
            <span>◀ 上一条</span>
        </button>
        <button class="cyber-btn current" id="btnCurrent">
            <span>● 当前</span>
        </button>
        <button class="cyber-btn" id="btnNext" onclick="nextQuote()">
            <span>下一条 ▶</span>
        </button>
        
        <div class="nav-indicator">
            <span>QUOTE</span>
            <span class="page-num" id="pageNum">01</span>
            <span>/ 08</span>
        </div>
    </div>

    <script>
        const quotes = [
            { text: "在广袤的空间和无限的时间中，能与你共享同一颗行星和同一段时光，是我莫大的荣幸。", author: "卡尔 · 萨根", book: "宇宙" },
            { text: "给岁月以文明，而不是给文明以岁月。", author: "刘慈欣", book: "三体" },
            { text: "世界上只有一种真正的英雄主义，那就是认清生活的真相后依然热爱生活。", author: "罗曼 · 罗兰", book: "米开朗基罗传" },
            { text: "我们都是由星尘构成的，当我们死去，我们将回归星空。", author: "尼尔 · 德格拉斯 · 泰森", book: "天体物理学" },
            { text: "不要温和地走进那个良夜，老年应当在日暮时燃烧咆哮。", author: "狄兰 · 托马斯", book: "诗集" },
            { text: "宇宙既不仁慈，也不恶毒，它只是对人类的悲欢无动于衷。", author: "史蒂芬 · 霍金", book: "时间简史" },
            { text: "你身体里的每一个原子都来自一颗爆炸了的恒星。", author: "劳伦斯 · 克劳斯", book: "一颗原子的时空之旅" },
            { text: "我们都是星尘，但我们用双手触碰彼此，这就是宇宙中最浪漫的事。", author: "佚名", book: "" }
        ];

        let currentIndex = 0;
        let isAnimating = false;

        // 关键词提取 - 基于语义和权重
        function extractKeywords(text) {
            // 停用词表
            const stopWords = new Set([
                '的', '了', '在', '是', '我', '有', '和', '就', '不', '人', '都', '一', '一个', '上', '也', 
                '很', '到', '说', '要', '去', '你', '会', '着', '没有', '看', '好', '自己', '这', '那', 
                '我们', '让', '把', '被', '给', '与', '及', '或', '但', '而', '因为', '所以', '如果', 
                '向', '从', '对', '关于', '地', '得', '能', '与', '同', '为', '它', '他', '她', '们',
                '来', '过', '下', '中', '大', '小', '多', '少', '个', '种', '里', '外', '前', '后'
            ]);
            
            // 预定义的高权重词汇（文学/哲学类）
            const highWeightWords = new Set([
                '宇宙', '星空', '时间', '空间', '生命', '死亡', '永恒', '灵魂', '真理', '智慧',
                '文明', '岁月', '时光', '世界', '人生', '命运', '自由', '孤独', '爱', '梦想',
                '希望', '绝望', '存在', '虚无', '意义', '价值', '信仰', '怀疑', '思考', '感悟',
                '自然', '天地', '万物', '星辰', '银河', '黑洞', '原子', '分子', '能量', '物质',
                '知识', '力量', '勇气', '坚持', '放弃', '选择', '责任', '使命', '命运', '宿命'
            ]);
            
            const wordFreq = {};
            const textLen = text.length;
            
            // 提取2-4字词组
            for (let len = 4; len >= 2; len--) {
                for (let i = 0; i <= textLen - len; i++) {
                    const word = text.substr(i, len);
                    
                    // 基本过滤
                    if (!/[\u4e00-\u9fa5]/.test(word)) continue; // 必须包含中文
                    if (/^[的了吗呢吧啊哦嗯哼]$/.test(word)) continue; // 过滤语气词
                    if (len === 2 && stopWords.has(word)) continue; // 2字停用词
                    
                    // 计算权重
                    let weight = len * 2; // 基础权重：长度越长权重越高
                    
                    // 高权重词汇加成
                    if (highWeightWords.has(word)) {
                        weight *= 3;
                    }
                    
                    // 位置权重（开头和结尾的词更重要）
                    if (i < textLen * 0.2 || i > textLen * 0.8) {
                        weight *= 1.5;
                    }
                    
                    wordFreq[word] = (wordFreq[word] || 0) + weight;
                }
            }
            
            // 过滤掉包含关系的短词（如果长词已存在）
            const sortedWords = Object.entries(wordFreq).sort((a, b) => b[1] - a[1]);
            const result = [];
            const usedWords = new Set();
            
            for (const [word, score] of sortedWords) {
                // 检查是否已被包含
                let isContained = false;
                for (const used of usedWords) {
                    if (used.includes(word) || word.includes(used)) {
                        // 如果已存在的词包含当前词，或当前词包含已存在的词，跳过短的
                        if (used.length >= word.length && used.includes(word)) {
                            isContained = true;
                            break;
                        }
                    }
                }
                
                if (!isContained && word.length >= 2) {
                    usedWords.add(word);
                    result.push({
                        word,
                        score: Math.min(98, Math.round(50 + score * 2))
                    });
                    
                    if (result.length >= 5) break;
                }
            }
            
            return result;
        }

        // 更新关键词显示
        function updateKeywords(text) {
            const keywords = extractKeywords(text);
            const container = document.getElementById('keywordsList');
            container.innerHTML = keywords.map(kw => 
                `<div class="keyword-tag">${kw.word} <span class="kw-score">${kw.score}%</span></div>`
            ).join('');
        }

        // 更新统计数据
        function updateStats(text) {
            document.getElementById('charCount').textContent = text.length;
            document.getElementById('wordCount').textContent = text.split(/[\s，。！？、；：""''（）]+/).filter(w => w.length > 0).length;
            document.getElementById('readTime').textContent = Math.max(5, Math.round(text.length / 3)) + 's';
        }

        // 切换书摘
        function switchQuote(newIndex) {
            if (isAnimating || newIndex === currentIndex) return;
            isAnimating = true;

            const quoteContent = document.getElementById('quoteContent');
            const heroTitle = document.getElementById('heroTitle');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');

            // 闪烁效果
            btnPrev.classList.add('flicker');
            btnNext.classList.add('flicker');

            // 退出动画
            quoteContent.classList.add('switching-out');
            heroTitle.classList.add('switching');

            setTimeout(() => {
                currentIndex = newIndex;
                const quote = quotes[currentIndex];

                // 更新内容
                document.getElementById('quoteText').textContent = quote.text;
                document.getElementById('quoteAuthor').textContent = quote.author + (quote.book ? ' · ' + quote.book : '');
                document.getElementById('heroTitle').textContent = quote.text.substring(0, 30) + '...';
                document.getElementById('heroAuthor').textContent = quote.author + ' · ' + (quote.book || '未知');
                document.getElementById('quoteIndex').textContent = (currentIndex + 1) + ' / ' + quotes.length;
                document.getElementById('pageNum').textContent = String(currentIndex + 1).padStart(2, '0');

                // 更新关键词和统计
                updateKeywords(quote.text);
                updateStats(quote.text);

                // 进入动画
                quoteContent.classList.remove('switching-out');
                quoteContent.classList.add('switching-in');
                heroTitle.classList.remove('switching');

                setTimeout(() => {
                    quoteContent.classList.remove('switching-in');
                    btnPrev.classList.remove('flicker');
                    btnNext.classList.remove('flicker');
                    isAnimating = false;
                }, 400);
            }, 300);
        }

        function nextQuote() {
            const newIndex = (currentIndex + 1) % quotes.length;
            switchQuote(newIndex);
        }

        function prevQuote() {
            const newIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            switchQuote(newIndex);
        }

        // 生成粒子
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 8 + 's';
                p.style.animationDuration = (5 + Math.random() * 5) + 's';
                container.appendChild(p);
            }
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevQuote();
            if (e.key === 'ArrowRight') nextQuote();
        });

        // 初始化
        createParticles();
        updateKeywords(quotes[0].text);
        updateStats(quotes[0].text);
    </script>
</body>
</html>
